<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>ManaMind — Mes Decklists Moxfield</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink-900: #0c0910; --ink-850: #120c1a; --ink-800: #17101f; --ink-700: #1d1529;
    --ink-panel: rgba(20, 13, 28, 0.62);
    --parch-100: #efe6d6; --parch-300: #cdbfa8; --parch-500: #9c8e79; --parch-600: #7c715f;
    --arcane: #a07be0; --arcane-deep: #6c4bb0; --arcane-glow: rgba(160, 123, 224, 0.55);
    --gold: #c9a45c; --gold-soft: #d8bd83; --gold-line: rgba(201, 164, 92, 0.42); --gold-faint: rgba(201, 164, 92, 0.16);
    --red: #c0392b; --red-soft: rgba(192,57,43,0.15);
    --green: #27ae60; --green-soft: rgba(39,174,96,0.15);
    --serif-display: "Cormorant Garamond", Georgia, serif;
    --serif-engraved: "Cinzel", Georgia, serif;
    --serif-body: "Spectral", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--parch-100); font-family: var(--serif-body); background: var(--ink-900); min-height: 100vh; }

  #scene {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-color: var(--ink-900);
  }
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .particle { position: absolute; border-radius: 50%; background: var(--arcane); opacity: 0; animation: float linear infinite; }
  @keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.3; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }

  #app {
    position: relative; z-index: 1;
    max-width: 1920px; margin: 0 auto;
    padding: 48px 48px 80px;
    display: flex; flex-direction: column; gap: 28px;
  }

  .site-header { display: flex; align-items: center; justify-content: space-between; }
  .back-link { font-family: var(--serif-engraved); font-size: 0.72rem; letter-spacing: 0.12em; color: var(--gold); text-decoration: none; opacity: 0.8; transition: opacity 0.2s; }
  .back-link:hover { opacity: 1; }

  .panel { background: var(--ink-panel); border: 1px solid var(--gold-line); border-radius: 14px; padding: 28px 32px; backdrop-filter: blur(8px); }
  .panel-title { font-family: var(--serif-engraved); font-size: 0.62rem; letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; margin: 0 0 6px; }

  .add-row { display: flex; gap: 12px; }
  .url-input {
    flex: 1; padding: 11px 16px; font-family: var(--serif-body); font-size: 0.9rem;
    color: var(--parch-100); background: rgba(12,9,16,0.55);
    border: 1px solid var(--gold-line); border-radius: 8px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .url-input:focus { border-color: var(--arcane); box-shadow: 0 0 0 3px var(--arcane-glow); }
  .url-input::placeholder { color: var(--parch-600); }
  .btn {
    padding: 11px 28px; font-family: var(--serif-engraved); font-size: 0.68rem; letter-spacing: 0.16em;
    border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s, transform 0.15s; white-space: nowrap;
  }
  .btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-gold { color: var(--ink-900); background: linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%); }
  .btn-ghost { color: var(--parch-500); background: rgba(255,255,255,0.05); border: 1px solid var(--gold-line); }
  .btn-danger { color: #fff; background: rgba(192,57,43,0.7); border: 1px solid rgba(192,57,43,0.4); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #feedback { padding: 10px 16px; border-radius: 8px; font-size: 0.88rem; display: none; }
  #feedback.ok  { background: var(--green-soft); border: 1px solid rgba(39,174,96,0.3); color: #6fcf97; }
  #feedback.err { background: var(--red-soft);   border: 1px solid rgba(192,57,43,0.3); color: #eb5757; }

  .deck-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .deck-row { display: flex; align-items: center; gap: 16px; background: rgba(12,9,16,0.4); border: 1px solid var(--gold-line); border-radius: 10px; padding: 14px 18px; }
  .deck-row-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .deck-commander { font-family: var(--serif-display); font-size: 1.05rem; font-weight: 600; color: var(--parch-100); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck-meta { font-size: 0.7rem; color: var(--parch-600); }
  .deck-meta a { color: var(--gold); opacity: 0.7; text-decoration: none; }
  .deck-meta a:hover { opacity: 1; }
  .source-pill { font-family: var(--serif-engraved); font-size: 0.48rem; letter-spacing: 0.12em; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; flex-shrink: 0; }
  .source-pill.moxfield { background: rgba(160,123,224,0.2); color: var(--arcane); border: 1px solid rgba(160,123,224,0.3); }
  .deck-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-copy-urgent { color: var(--ink-900) !important; background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%) !important; border: none !important; animation: pulse-orange 1.8s ease-in-out infinite; }
  @keyframes pulse-orange { 0%, 100% { box-shadow: 0 0 0 0 rgba(230,126,34,0.5); } 50% { box-shadow: 0 0 0 6px rgba(230,126,34,0); } }
  .modified-pill { font-family: var(--serif-engraved); font-size: 0.45rem; letter-spacing: 0.1em; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; flex-shrink: 0; background: rgba(230,126,34,0.15); color: #e67e22; border: 1px solid rgba(230,126,34,0.4); }

  .empty-state { text-align: center; padding: 32px; color: var(--parch-500); font-style: italic; }
  .spinner-inline { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-left: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .import-link { display:block; text-align:center; margin-top:8px; font-size:.78rem; color:var(--gold); text-decoration:none; font-family:var(--serif-engraved); letter-spacing:.08em; opacity:.7; }
  .import-link:hover { opacity:1; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="particles"></div>

<div id="app">
  <header class="site-header" style="display:flex;align-items:center;gap:24px;padding-bottom:16px;border-bottom:1px solid var(--gold-line);">
    <a href="/" class="back-link" style="flex-shrink:0;">← Accueil</a>
    <h1 style="margin:0;flex:1;text-align:center;font-family:var(--serif-display);font-size:clamp(1.4rem,3vw,2rem);font-weight:600;color:var(--parch-100);">Gérer mes Decklists Moxfield</h1>
    <button onclick="refreshAll()" id="refreshAllBtn" class="btn btn-gold" style="flex-shrink:0;">↻ Tout mettre à jour</button>
  </header>

  <div class="panel">
    <div class="add-row">
      <input type="url" id="urlInput" class="url-input" placeholder="https://moxfield.com/decks/..." />
      <button class="btn btn-gold" id="addBtn" onclick="addDeck()">Ajouter</button>
    </div>
    <div id="feedback" style="margin-top:12px;"></div>
  </div>

  <div class="panel">
    <p class="panel-title">Decks Moxfield configurés</p>
    <div class="deck-list" id="deckList">
      <div class="empty-state">Chargement…</div>
    </div>
  </div>

  <a href="/deck-config" class="import-link">+ Importer depuis un autre format (Arena, CSV, fichier…)</a>
</div>

<script src="/auth-guard.js"></script>
<script>
  (function () {
    const c = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div'); p.className = 'particle';
      const s = Math.random() * 3 + 1;
      p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*14}s;animation-delay:${Math.random()*12}s`;
      c.appendChild(p);
    }
  })();

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function showFeedback(msg, isOk) {
    const el = document.getElementById('feedback');
    el.textContent = msg; el.className = isOk ? 'ok' : 'err'; el.style.display = '';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  async function loadDecks() {
    const list = document.getElementById('deckList');
    try {
      const res = await fetch('/api/moxfield-decks');
      const data = await res.json();
      const decks = data.decks || [];
      if (!decks.length) { list.innerHTML = `<div class="empty-state">Aucun deck Moxfield configuré.</div>`; return; }
      decks.sort((a, b) => (a.commander || '').localeCompare(b.commander || ''));
      list.innerHTML = decks.map(d => {
        const mod = d.locally_modified;
        const id = escHtml(d.deck_id);
        return `<div class="deck-row" id="row-${id}">
          <div class="deck-row-info">
            <div class="deck-commander">${escHtml(d.commander || 'Commandant inconnu')}</div>
            <div class="deck-meta">${d.name ? escHtml(d.name) + ' · ' : ''}<a href="${escHtml(d.url)}" target="_blank">${escHtml(d.url)}</a></div>
          </div>
          ${mod ? '<span class="modified-pill">Modifié localement</span>' : '<span class="source-pill moxfield">Moxfield</span>'}
          <div class="deck-actions">
            <button class="btn ${mod ? 'btn-copy-urgent' : 'btn-ghost'}" id="copy-${id}" onclick="copyDeckTxt('${id}', this)">
              ${mod ? '⚠ Copier' : 'Copier'}
            </button>
            <button class="btn btn-ghost" onclick="refreshDeck('${id}')" ${mod ? 'disabled' : ''}>Mettre à jour</button>
            <button class="btn btn-danger" id="del-${id}" onclick="deleteDeck('${id}')" disabled>Supprimer</button>
          </div>
        </div>`;
      }).join('');
    } catch { list.innerHTML = `<div class="empty-state">Erreur de chargement.</div>`; }
  }

  async function addDeck() {
    const input = document.getElementById('urlInput');
    const btn = document.getElementById('addBtn');
    const url = input.value.trim();
    if (!url) return;
    btn.disabled = true; btn.innerHTML = `Ajout en cours<span class="spinner-inline"></span>`;
    try {
      const res = await fetch('/api/moxfield-decks', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url}) });
      const data = await res.json();
      if (!res.ok || data.error) { showFeedback(data.error || 'Erreur inconnue', false); }
      else { showFeedback(`✓ Deck ajouté : ${data.deck.commander}`, true); input.value = ''; loadDecks(); }
    } catch { showFeedback('Erreur réseau', false); }
    finally { btn.disabled = false; btn.textContent = 'Ajouter'; }
  }

  async function refreshDeck(deckId) {
    try {
      const res = await fetch(`/api/moxfield-decks/${deckId}/refresh`, {method:'POST'});
      const data = await res.json();
      if (!res.ok || data.error) { showFeedback(data.error || 'Erreur', false); }
      else { showFeedback(`✓ Deck mis à jour : ${data.deck.commander}`, true); loadDecks(); }
    } catch { showFeedback('Erreur réseau', false); }
  }

  async function refreshAll() {
    const btn = document.getElementById('refreshAllBtn');
    btn.disabled = true; btn.textContent = '↻ Mise à jour…';
    const deckIds = Array.from(document.querySelectorAll('[id^="row-"]')).map(r => r.id.replace('row-',''));
    if (!deckIds.length) { showFeedback('Aucun deck.', false); btn.disabled=false; btn.textContent='↻ Tout mettre à jour'; return; }
    let ok=0, fail=0;
    for (const id of deckIds) {
      try { const r = await fetch(`/api/moxfield-decks/${id}/refresh`,{method:'POST'}); const d = await r.json(); if (!r.ok||d.error) fail++; else ok++; }
      catch { fail++; }
    }
    showFeedback(`✓ ${ok} deck${ok>1?'s':''} mis à jour${fail?` · ${fail} échec`:''}`, fail===0);
    loadDecks(); btn.disabled=false; btn.textContent='↻ Tout mettre à jour';
  }

  async function deleteDeck(deckId) {
    if (!confirm('Supprimer ce deck ?')) return;
    try {
      const res = await fetch(`/api/moxfield-decks/${deckId}`, {method:'DELETE'});
      const data = await res.json();
      if (data.ok) { showFeedback('Deck supprimé.', true); loadDecks(); }
      else showFeedback('Introuvable.', false);
    } catch { showFeedback('Erreur réseau', false); }
  }

  async function copyDeckTxt(deckId, btn) {
    btn.disabled = true;
    try {
      const res = await fetch(`/api/deck-txt/${deckId}`);
      const data = await res.json();
      if (!res.ok || !data.content) { showFeedback('Contenu introuvable.', false); btn.disabled=false; return; }
      await navigator.clipboard.writeText(data.content);
      await fetch(`/api/deck-txt/${deckId}/mark-synced`, {method:'POST'});
      btn.textContent='✓ Copié !'; btn.className=btn.className.replace('btn-copy-urgent','btn-ghost'); btn.title='Copier';
      const row = document.getElementById(`row-${deckId}`);
      if (row) {
        const pill = row.querySelector('.modified-pill');
        if (pill) { const np=document.createElement('span'); np.className='source-pill moxfield'; np.textContent='Moxfield'; pill.replaceWith(np); }
        row.querySelectorAll('button').forEach(b => { if (b.textContent.includes('Mettre à jour')) { b.disabled=false; b.removeAttribute('title'); } });
        const del = document.getElementById(`del-${deckId}`); if (del) { del.disabled=false; }
      }
      setTimeout(()=>{ btn.textContent='Copier'; btn.disabled=false; }, 2000);
    } catch { showFeedback('Erreur lors de la copie.', false); btn.disabled=false; }
  }

  document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key==='Enter') addDeck(); });
  loadDecks();
</script>
</body>
</html>
