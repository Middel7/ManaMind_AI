<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Résultats d'analyse</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08080C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ManaMind">
<link rel="icon" href="/static/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .gauge { display: flex; align-items: center; gap: var(--sp-4); }
  .gauge__ring {
    --value: 0;
    width: 78px; height: 78px; flex-shrink: 0;
    border-radius: 50%;
    display: grid; place-items: center;
    background: conic-gradient(var(--accent) calc(var(--value) * 1%),
                               var(--surface-3) 0);
    position: relative;
  }
  .gauge__ring::after {
    content: ""; position: absolute; inset: 7px;
    border-radius: 50%; background: var(--bg-raised);
  }
  .gauge__value {
    position: relative; z-index: 1;
    font-family: var(--font-display); font-size: var(--text-xl);
    font-variant-numeric: tabular-nums;
  }

  .swap-row {
    display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto;
    gap: var(--sp-3); align-items: center;
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 1px solid var(--line);
  }
  .swap-row:last-child { border-bottom: none; }
  .swap-row:hover { background: var(--surface); }
  .swap-row__side { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
  .swap-row__thumb { width: 34px; aspect-ratio: var(--card-ratio); object-fit: cover;
    border-radius: 3px; background: var(--surface-2); flex-shrink: 0; }
  /* Quatre colonnes ne tiennent pas sur un telephone. La fleche etait alors
     masquee et les deux cartes s'empilaient sans rien qui les relie : restaient
     deux noms, l'un rouge, l'autre or, qu'il fallait deviner. Elle bascule a la
     verticale et passe a gauche, ou elle enjambe les deux lignes — c'est elle
     qui porte le « remplacee par ». Le gain garde sa colonne de droite. */
  @media (max-width: 720px) {
    .swap-row {
      grid-template-columns: 16px minmax(0, 1fr) auto;
      gap: var(--sp-1) var(--sp-3);
      align-items: center;
    }
    .swap-row > :nth-child(1) { grid-column: 2; grid-row: 1; }
    .swap-row > :nth-child(2) {
      grid-column: 1; grid-row: 1 / 3;
      justify-self: center;
      transform: rotate(90deg);
    }
    .swap-row > :nth-child(3) { grid-column: 2; grid-row: 2; }
    .swap-row > :nth-child(4) { grid-column: 3; grid-row: 1 / 3; }
  }

  /* Le titre mene au deck analyse : il garde l'allure d'un titre, et ne se
     revele lien qu'au survol, pour ne pas souligner tout le bandeau. */
  .results-hero__link {
    color: inherit;
    text-decoration: none;
    transition: color var(--dur-fast) var(--ease);
  }
  .results-hero__link:hover { color: var(--accent); }

  /* Bandeau fin : la courbe, les symboles et les compteurs sont partis dans
     l'onglet « Analyse poussee ». Il ne dit plus que le deck et le type
     d'analyse, et porte les deux actions qui quittent la page. */
  .results-hero .hero__body { padding-block: var(--sp-4); }
  .results-hero .hero__title { font-size: var(--text-xl); }
  /* Deux boutons tiennent cote a cote : empiles (le defaut de .hero__split),
     ils rehaussaient le bandeau que l'on veut fin. */
  .results-hero .hero__split .hero__actions { flex-direction: row; flex-wrap: wrap; }

  /* Onglets a gauche, filtres a droite sur la meme ligne : une rangee de
     moins entre le bandeau et les cartes. La ligne de base court sous les
     deux ; le soulignement de l'onglet actif vient la recouvrir. */
  .results-tabbar {
    display: flex; align-items: flex-end; gap: var(--sp-4);
    border-bottom: 1px solid var(--line);
  }
  .results-tabbar .view-tabs { border-bottom: 0; flex: 0 0 auto; }
  .results-tabbar__filters {
    margin-left: auto;
    display: flex; flex-wrap: wrap; justify-content: flex-end;
    gap: var(--sp-2) var(--sp-3);
    padding-bottom: var(--sp-2);
  }
  /* Sous 1400 px, onglets et filtres ne tiennent plus ensemble : les filtres
     passent sous la ligne des onglets, qui reprend sa propre bordure. */
  @media (max-width: 1400px) {
    .results-tabbar { flex-direction: column; align-items: stretch; gap: var(--sp-3); border-bottom: 0; }
    .results-tabbar .view-tabs { border-bottom: 1px solid var(--line); }
    .results-tabbar__filters { margin-left: 0; justify-content: flex-start; padding-bottom: 0; }
  }
</style>
</head>
<body>

<div id="page">
  <section class="hero results-hero" id="hero">
    <div class="hero__body">
      <div class="skeleton skeleton--text" style="width:280px;height:28px"></div>
    </div>
  </section>
  <div id="content">
    <div class="center" style="padding:80px"><span class="spinner spinner--lg"></span></div>
  </div>
</div>

<script src="/static/js/mm.js"></script>
<script src="/static/js/deep.js"></script>
<script>
(async () => {
  const user = await MM.boot({
    title: 'Résultats', nav: 'analyze',
  });
  if (!user) return;

  const params = new URLSearchParams(location.search);
  const algo = params.get('algo') || 'v1';
  const content = MM.el('#content');

  let deckInfo = {};
  try { deckInfo = JSON.parse(sessionStorage.getItem('mm_analysis_deck')) || {}; } catch {}

  /** Retient l'adresse des resultats affiches : la page autonome de
   *  l'analyse poussee y ramene. Appelee seulement quand il y a un resultat. */
  function rememberResults() {
    try { sessionStorage.setItem('mm_analysis_url', location.pathname + location.search); }
    catch { /* le bouton de retour ne s'affichera pas, rien d'autre */ }
  }

  /* ── Bandeau ───────────────────────────────────────────────────────────── */

  function renderHero(subtitle, { edit = true } = {}) {
    const art = deckInfo.scryfall_id ? MM.scryfallArt(deckInfo.scryfall_id) : null;
    const eyebrow = MM.deckEyebrow(deckInfo.commander, deckInfo.name)
      || (deckInfo.commander ? '' : 'Analyse');
    const title = MM.esc(deckInfo.name || 'Résultats d’analyse');
    MM.el('#hero').innerHTML = `
      ${art ? `<div class="hero__art" style="background-image:url('${MM.esc(art)}')"></div>` : ''}
      <div class="hero__body">
        <div class="hero__split">
          <div class="grow stack-2" style="gap:2px">
            ${eyebrow ? `<p class="eyebrow">${MM.esc(eyebrow)}</p>` : ''}
            <h2 class="hero__title">${deckInfo.deck_id
              ? `<a class="results-hero__link" href="/decks/${encodeURIComponent(deckInfo.deck_id)}"
                   title="Ouvrir le deck">${title}</a>`
              : title}</h2>
            <p class="muted small">${MM.esc(subtitle)}</p>
          </div>
          <div class="hero__actions">
            ${deckInfo.deck_id
              ? `<a class="btn btn--sm" href="/decks/${encodeURIComponent(deckInfo.deck_id)}">
                   Ouvrir le deck</a>` : ''}
            ${edit && canEdit ? `
              <button class="btn btn--primary btn--sm" id="addCard" type="button">
                Ajouter ou retirer une carte</button>` : ''}
            <a class="btn btn--sm btn--ghost" href="/decks/analyse">Nouvelle analyse</a>
          </div>
        </div>
      </div>`;
  }

  /* ── Cartes du deck ────────────────────────────────────────────────────── */

  // Les resultats d'analyse ne portent pas la liste du deck : on la relit
  // pour la quantite de depart des reglages, et pour le mana de l'analyse
  // poussee. Relue apres chaque changement, le mana suit les ajouts.
  let deckCards = null;
  let deep = null;   // l'analyse poussee, une fois l'onglet ouvert
  let deckLoad = Promise.resolve();
  function loadDeckCards() {
    if (!deckInfo.deck_id) return deckLoad;
    deckLoad = MM.api.get(`/api/v2/decks/${encodeURIComponent(deckInfo.deck_id)}`)
      .then((data) => {
        deckCards = data.cards || [];
        if (deep) deep.setDeckCards(deckCards);
      })
      .catch(() => {});
    return deckLoad;
  }
  loadDeckCards();

  // Les analyses ouvertes sans contexte de deck (lien direct, session videe)
  // n'ont pas de commandant : sans lui, impossible de modifier une liste.
  const canEdit = Boolean(deckInfo.commander);
  if (canEdit) MM.deckContext = deckInfo;   // cible des reglages « dans le deck »

  // Chaque reglage part de la quantite reelle du deck : un retrait de terrain
  // de base porte souvent sur plus d'un exemplaire.
  const inDeck = (name) => {
    const line = (deckCards || []).find((entry) =>
      entry.card_name.toLowerCase() === name.toLowerCase());
    return line ? line.quantity : 0;
  };

  /** Le bouton « Ajouter ou retirer une carte » et ce qu'il declenche. */
  function wireEditing() {
    if (!canEdit) return;
    MM.el('#addCard').addEventListener('click', () => {
      // Meme fenetre que sur la fiche du deck, qui reste ouverte pour
      // enchainer : une carte deja presente y affiche sa quantite, et le
      // « − » la retire.
      MM.addCardDialog({
        title: 'Ajouter ou retirer une carte',
        deckQty: inDeck,
        ready: () => deckLoad,
        basics: true,
      });
    });

    document.addEventListener('mm:card-change', (event) => {
      if (event.detail.scope !== 'deck') return;
      // Le deck vient de changer : ses quantites sont relues pour la suite.
      loadDeckCards();
      const deckName = deckInfo.name || 'votre deck';
      if (event.detail.delta < 0) {
        MM.toast.ok(`${event.detail.card_name} retirée de ${deckName}.`);
      } else {
        MM.toast.ok(`${event.detail.card_name} ajoutée à ${deckName}.`);
      }
    });
  }

  /* ── Onglets ───────────────────────────────────────────────────────────── */

  // L'onglet ouvert se lit dans l'adresse : un rechargement y ramene, et le
  // retour du navigateur ne fait pas quitter les resultats.
  // L'analyse vient en premier, et s'ouvre d'emblee : elle dit ce que fait le
  // deck avant que l'on choisisse quoi y ajouter ou en retirer.
  const TABS = [
    { id: 'deep', hash: 'analyse', label: 'Analyse', short: 'Analyse' },
    { id: 'add', hash: 'ajouter', label: 'Cartes à ajouter', short: 'À ajouter' },
    { id: 'cut', hash: 'retirer', label: 'Cartes à retirer', short: 'À retirer' },
  ];

  /**
   * Monte les trois onglets dans #content.
   * @param {object} o
   *   counts   {add, cut}  chiffres portes par les deux premiers onglets
   *   filters  {string}    filtres propres aux onglets de cartes (HTML), poses
   *                        sur la ligne des onglets
   *   deepBefore {string}  HTML pose en tete de l'analyse poussee
   *   onTab    {(id)=>void} appele a chaque changement d'onglet
   */
  function mountTabs({ counts, filters = '', deepBefore = '', onTab = () => {} }) {
    content.innerHTML = `
      <div class="stack-4">
        <div class="results-tabbar">
        <div class="view-tabs" role="tablist" aria-label="Résultats de l’analyse">
          ${TABS.map((tab) => `
            <button class="view-tab" role="tab" type="button" id="tab-${tab.id}"
                    data-tab="${tab.id}" aria-controls="panel-${tab.id}"
                    aria-selected="false" tabindex="-1" aria-label="${tab.label}">
              <span class="view-tab__long">${tab.label}</span>
              <span class="view-tab__short" aria-hidden="true">${tab.short}</span>
              ${counts[tab.id] != null
                ? `<span class="view-tab__count" id="count-${tab.id}">${MM.fmt.int(counts[tab.id])}</span>`
                : ''}
            </button>`).join('')}
        </div>
        ${filters ? `<div class="results-tabbar__filters" id="filters">${filters}</div>` : ''}
        </div>
        ${TABS.map((tab) => `
          <div role="tabpanel" id="panel-${tab.id}" aria-labelledby="tab-${tab.id}" hidden></div>`).join('')}
      </div>`;

    wireEditing();

    const show = (id, { focus = false } = {}) => {
      TABS.forEach((tab) => {
        const selected = tab.id === id;
        const button = MM.el(`#tab-${tab.id}`);
        button.setAttribute('aria-selected', String(selected));
        button.tabIndex = selected ? 0 : -1;
        if (selected && focus) button.focus();
        MM.el(`#panel-${tab.id}`).hidden = !selected;
      });
      if (filters) MM.el('#filters').hidden = id === 'deep';
      const hash = TABS.find((tab) => tab.id === id).hash;
      history.replaceState(null, '', `${location.pathname}${location.search}#${hash}`);

      // L'analyse ne se calcule qu'une fois, a sa premiere ouverture.
      if (id === 'deep' && !deep && deckInfo.deck_id) {
        deep = { setDeckCards() {} };   // garde contre un double chargement
        MM.deepAnalysis(MM.el('#panel-deep'), {
          deckId: deckInfo.deck_id,
          commander: deckInfo.commander || null,
          deckCards,
          before: deepBefore,
        }).then((instance) => {
          deep = instance;
          if (deckCards) deep.setDeckCards(deckCards);
        });
      } else if (id === 'deep' && !deckInfo.deck_id) {
        MM.el('#panel-deep').innerHTML = deepBefore + MM.empty({
          icon: 'box', title: 'Analyse indisponible',
          text: 'Elle porte sur un deck enregistré : relancez l’analyse depuis l’un de vos decks.',
          action: { href: '/decks/analyse', label: 'Analyser un deck' },
        });
      }
      onTab(id);
    };

    const tablist = MM.el('.view-tabs', content);
    tablist.addEventListener('click', (event) => {
      const button = event.target.closest('[data-tab]');
      if (button) show(button.dataset.tab);
    });
    // Fleches gauche et droite d'un onglet a l'autre, comme le veut le motif.
    tablist.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
      const current = TABS.findIndex((tab) =>
        MM.el(`#tab-${tab.id}`).getAttribute('aria-selected') === 'true');
      const step = event.key === 'ArrowRight' ? 1 : -1;
      show(TABS[(current + step + TABS.length) % TABS.length].id, { focus: true });
      event.preventDefault();
    });

    // « #poussee » : l'ancien nom de l'onglet Analyse, encore dans des liens.
    const hash = location.hash === '#poussee' ? '#analyse' : location.hash;
    const fromHash = TABS.find((tab) => `#${tab.hash}` === hash);
    show(fromHash ? fromHash.id : 'deep');
  }

  /* Cette page n'affiche que le resultat de la derniere analyse : arriver ici
     par un signet ou un rechargement ne montre rien. Plutot qu'un vide, on dit
     pourquoi et par ou repartir. */
  function fail(message) {
    // Sans deck connu, le bandeau n'a ni illustration ni titre a porter : il ne
    // ferait qu'un grand rectangle vide au-dessus du message.
    if (deckInfo.deck_id) renderHero('Analyse indisponible', { edit: false });
    else MM.el('#hero').hidden = true;
    content.innerHTML = `
      <div class="intro">
        <div class="intro__panel">
          <div class="intro__head">
            <span class="intro__mark">${MM.icons.warning}</span>
            <div class="stack-2" style="gap:4px">
              <p class="intro__title">Aucun résultat à afficher</p>
              <p class="small muted">${MM.esc(message)}</p>
            </div>
          </div>
          <p class="walk__text">
            Les résultats d'analyse ne sont pas conservés : ils vivent le temps de
            votre visite. Un rafraîchissement de la page, un lien mis en favori ou
            un retour le lendemain ramènent donc ici. Relancer l'analyse prend
            quelques secondes et repart de l'état actuel du deck — c'est aussi la
            bonne façon de mesurer l'effet des cartes que vous venez d'ajouter.
          </p>
          <div class="cluster-2">
            <a class="btn btn--primary" href="/decks/analyse">Relancer une analyse</a>
            <a class="btn" href="/decks">Voir mes decks</a>
          </div>
        </div>

        <div class="intro__panel intro__panel--soft">
          <div class="stack-2" style="gap:var(--sp-4)">
            <p class="h4">Autres façons d'améliorer un deck</p>
            <div class="checks">
              <div class="checks__item">${MM.icons.check}
                <span><b>Avec les cartes que vous possédez déjà :</b>
                  <a href="/decks/ameliorer" style="color:var(--accent)">Améliorer mon
                  deck avec ma collection</a> ne propose rien qu'il faille acheter.</span>
              </div>
              <div class="checks__item">${MM.icons.check}
                <span><b>En allégeant plutôt qu'en ajoutant :</b>
                  <a href="/decks/alleger" style="color:var(--accent)">Quelles cartes
                  retirer</a> montre celles que les autres decks du même commandant
                  ne jouent pas.</span>
              </div>
              <div class="checks__item">${MM.icons.check}
                <span><b>En changeant de tête :</b>
                  <a href="/decks/commandant" style="color:var(--accent)">Un autre
                  commandant pour ce deck</a> mesure ce que votre liste garderait.</span>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }

  /* ═══ Analyse par intelligence artificielle ═══════════════════════════ */

  if (algo === 'hybrid') {
    let result;
    try {
      result = JSON.parse(sessionStorage.getItem('deckMentorResult'));
    } catch { result = null; }
    if (!result) return fail("Les résultats n'ont pas été trouvés. Relancez l'analyse.");
    rememberResults();

    const score = Math.round((result.deck_score || 0) * 100);
    const coherence = Math.round((result.coherence || 0) * 100);
    const distance = Math.round((result.distance_meta || 0) * 100);

    renderHero('Analyse par le moteur d’intelligence artificielle');

    const replacements = (result.replacements || []).slice(0, 20);
    const additions = (result.top_additions || []).slice(0, 24);
    const cuts = (result.top_cuts || []).slice(0, 24);

    const resolved = await MM.resolveCards([
      ...additions.map((c) => c.card_name),
      ...cuts.map((c) => c.card_name),
      ...replacements.flatMap((r) => [r.cut_card, r.add_card]),
    ].filter(Boolean));

    const thumb = (name) => {
      const info = resolved[name] || {};
      return info.image_small
        ? `<img class="swap-row__thumb" src="${MM.esc(info.image_small)}" alt="" loading="lazy">`
        : '<span class="swap-row__thumb"></span>';
    };

    const iaGrid = (list, scoreOf) => `
      <div class="card-grid">
        ${list.map((card) => MM.cardTile(
          { ...(resolved[card.card_name] || {}), card_name: card.card_name },
          { context: null, note: `${(scoreOf(card) * 100).toFixed(0)} pts` })).join('')}
      </div>`;

    const gaps = (result.gap || []).slice(0, 10);

    // Le score et les ecarts par famille sont propres au moteur : ils ouvrent
    // l'analyse poussee, au-dessus du mana et des categories.
    const deepBefore = `
      <div class="grid-2" style="align-items:start">
        <div class="panel">
          <div class="panel__head"><h2 class="h3">Score global</h2></div>
          <div class="panel__body stack">
            <div class="gauge">
              <div class="gauge__ring" style="--value:${score}">
                <span class="gauge__value">${score}</span>
              </div>
              <div class="stack-2">
                <p class="small">Cohérence <strong>${coherence} %</strong></p>
                <p class="small">Écart à la méta <strong>${distance} %</strong></p>
                <p class="xs dim">Plus l'écart est faible, plus le deck ressemble
                  à ce qui se joue habituellement.</p>
              </div>
            </div>
          </div>
        </div>
        ${gaps.length ? `
          <div class="panel">
            <div class="panel__head">
              <div class="stack-2">
                <h2 class="h3">Écarts par famille</h2>
                <p class="xs dim">Votre deck comparé à la moyenne des decks du
                  même commandant.</p>
              </div>
            </div>
            <div class="panel__body">
              ${gaps.map((gap) => {
                const deck = (gap.deck_share || 0) * 100;
                const meta = (gap.meta_share || 0) * 100;
                const max = Math.max(deck, meta, 1);
                const delta = (gap.delta || 0) * 100;
                return `
                  <div class="gap-row">
                    <span class="gap-row__label truncate"
                          title="${MM.esc(gap.cluster_name)}">
                      ${MM.esc(gap.cluster_name)}</span>
                    <span class="gap-row__track">
                      <span class="gap-row__meta" style="width:${(meta / max) * 100}%"></span>
                      <span class="gap-row__deck" style="width:${(deck / max) * 100}%"></span>
                    </span>
                    <span class="gap-row__delta ${delta < 0 ? 'accent' : 'dim'}">
                      ${delta > 0 ? '+' : ''}${delta.toFixed(1)} pt</span>
                  </div>`;
              }).join('')}
              <p class="xs dim" style="margin-top:var(--sp-3)">
                Barre claire : la méta. Barre dorée : votre deck.
                Un écart négatif signale une famille sous-représentée chez vous.
              </p>
            </div>
          </div>` : ''}
      </div>`;

    mountTabs({
      counts: { add: additions.length + replacements.length, cut: cuts.length },
      deepBefore,
    });

    MM.el('#panel-add').innerHTML = `
      <div class="stack-6">
        ${replacements.length ? `
          <div class="panel">
            <div class="panel__head">
              <h2 class="h3">Remplacements suggérés</h2>
              <span class="badge">${replacements.length}</span>
            </div>
            <div class="panel__body panel__body--flush">
              ${replacements.map((swap) => `
                <div class="swap-row">
                  <span class="swap-row__side">
                    ${thumb(swap.cut_card)}
                    <span class="truncate small" style="color:var(--danger)">
                      ${MM.esc(swap.cut_card)}</span>
                  </span>
                  <span class="swap-row__arrow accent"><span aria-hidden="true">→</span
                    ><span class="sr-only">remplacée par</span></span>
                  <span class="swap-row__side">
                    ${thumb(swap.add_card)}
                    <span class="truncate small accent">${MM.esc(swap.add_card)}</span>
                  </span>
                  <span class="xs dim num">+${(swap.gain_delta || 0).toFixed(0)}</span>
                </div>`).join('')}
            </div>
          </div>` : ''}
        <section class="stack-2">
          <h2 class="h3">Ajouts recommandés</h2>
          ${additions.length ? iaGrid(additions, (c) => c.addition_score || 0)
            : '<p class="muted small">Aucun ajout proposé pour ce deck.</p>'}
        </section>
      </div>`;

    MM.el('#panel-cut').innerHTML = cuts.length
      ? iaGrid(cuts, (c) => c.cut_score || 0)
      : '<p class="muted small">Aucun retrait proposé pour ce deck.</p>';
    return;
  }

  /* ═══ Analyse par popularite (CSV) ════════════════════════════════════ */

  const csv = params.get('csv');
  if (!csv) return fail("Aucune analyse n'a été lancée depuis cet onglet.");

  let rows;
  try {
    const response = await fetch(csv);
    if (!response.ok) throw new Error('Fichier de résultats introuvable');
    rows = parseCsv(await response.text());
  } catch (err) {
    return fail(err.message);
  }
  rememberResults();

  /** Le script de recommandation produit un CSV Section,Card Name,Score,Support,… */
  function parseCsv(text) {
    const lines = text.replace(/^﻿/, '').replace(/\r/g, '').split('\n')
      .filter((line) => line.trim().length);
    if (!lines.length) return [];

    const split = (line) => {
      const cells = [];
      let current = '';
      let quoted = false;
      for (let i = 0; i < line.length; i += 1) {
        const char = line[i];
        if (quoted) {
          if (char === '"') {
            if (line[i + 1] === '"') { current += '"'; i += 1; } else quoted = false;
          } else current += char;
        } else if (char === '"') quoted = true;
        else if (char === ',') { cells.push(current); current = ''; }
        else current += char;
      }
      cells.push(current);
      return cells;
    };

    const headers = split(lines[0]).map((h) => h.trim().toLowerCase().replace(/\s+/g, '_'));
    const at = (cells, name) => (cells[headers.indexOf(name)] || '').trim();

    return lines.slice(1).map(split)
      .map((cells) => ({
        section: at(cells, 'section') || cells[0] || '',
        name: at(cells, 'card_name') || cells[1] || '',
        score: at(cells, 'score'),
        support: at(cells, 'support'),
        frequency: at(cells, 'deck_frequency'),
      }))
      .filter((row) => row.name);
  }

  // Le CSV mele des en-tetes de section ("Additions", "Removals") et les lignes
  // de donnees, dont la colonne Section vaut "add" ou "remove".
  const inSection = (row, ...labels) => {
    const section = row.section.trim().toLowerCase();
    return labels.some((label) => section === label);
  };

  // Le CSV porte une reserve d'ajouts : la page en montre ADD_SHOWN, pris
  // parmi ceux qui passent les filtres, pour que filtrer ne vide pas l'onglet.
  const ADD_SHOWN = 42;
  const commander = rows.find((row) => inSection(row, 'commander'));
  const additions = rows.filter((row) => inSection(row, 'add', 'addition'));
  const removals = rows.filter((row) => inSection(row, 'remove', 'removal', 'cut'));

  if (commander && !deckInfo.commander) deckInfo.commander = commander.name;

  const resolved = await MM.resolveCards(
    [...additions, ...removals].map((row) => row.name).concat(
      commander ? [commander.name] : []));

  if (!deckInfo.scryfall_id && commander && resolved[commander.name]) {
    deckInfo.scryfall_id = resolved[commander.name].scryfall_id;
  }

  renderHero('Analyse fondée sur la popularité réelle des cartes');

  // Cartes deja ajoutees a la main a la buylist, en minuscules. Une carte
  // proposee en ajout est une carte a acquerir : le bouton « Vendre » y cede la
  // place a la buylist. Sans reponse, toutes s'affichent « a ajouter ».
  const pinned = new Set();
  try {
    (await MM.api.get('/api/v2/buylist/pinned')).cards
      .forEach((name) => pinned.add(name.toLowerCase()));
  } catch { /* la buylist reste utilisable, son etat initial seul manque */ }

  await deckLoad;

  const tile = (row, kind) => MM.cardTile(
    { ...(resolved[row.name] || {}), card_name: row.name },
    {
      context: canEdit ? 'deck' : null,
      buylist: kind === 'add' ? pinned.has(row.name.toLowerCase()) : null,
      // Un retrait porte sur une carte du deck : au moins un exemplaire, meme
      // si le contenu du deck n'a pas pu etre lu.
      deckQty: kind === 'add' ? inDeck(row.name) : Math.max(1, inDeck(row.name)),
      note: row.frequency
        ? `${MM.esc(row.frequency)} % des decks`
        : (row.score ? `score ${MM.esc(row.score)}` : ''),
    });

  const grid = (list, kind, empty) => list.length
    ? `<div class="card-grid">${list.map((row) => tile(row, kind)).join('')}</div>`
    : `<p class="muted small">${empty}</p>`;

  // Plafond de prix, commun aux deux onglets de cartes. null = aucun filtre.
  const CAPS = [null, 20, 10, 5];
  let priceCap = null;

  // Au-dela de cette part des decks publics, une carte est un incontournable :
  // la proposer n'apprend rien, elle est jouee partout.
  const STAPLE_RATE = 40;
  let hideStaples = false;
  let hideLands = false;

  /** Une carte sans prix connu ne peut pas etre garantie sous le plafond :
   *  elle sort de la liste des que l'on en fixe un. */
  const underCap = (row) => {
    if (priceCap == null) return true;
    const price = (resolved[row.name] || {}).unit_price;
    return price != null && price <= priceCap;
  };

  /** Filtres d'affichage, sur les cartes a ajouter. */
  const shown = (row) => {
    if (!underCap(row)) return false;
    const info = resolved[row.name] || {};
    if (hideStaples && (info.global_frequency || 0) > STAPLE_RATE) return false;
    if (hideLands && /\bLand\b/i.test(info.type_line || '')) return false;
    return true;
  };

  mountTabs({
    counts: { add: Math.min(ADD_SHOWN, additions.length), cut: removals.length },
    filters: `
      <div class="chips" id="priceFilter">
        ${CAPS.map((cap) => `
          <button class="chip" data-cap="${cap === null ? '' : cap}"
                  aria-pressed="${cap === null}">
            ${cap === null ? 'Tous les prix' : `${cap} € et moins`}</button>`).join('')}
      </div>
      <div class="chips" id="kindFilter">
        <button class="chip" data-hide="staples" aria-pressed="false"
                title="Masquer les cartes jouées dans plus de ${STAPLE_RATE} % des decks,
                       comme Sol Ring ou Arcane Signet">
          Sans les incontournables</button>
        <button class="chip" data-hide="lands" aria-pressed="false"
                title="Masquer les terrains">Sans les terrains</button>
      </div>`,
    // Les filtres d'incontournables et de terrains ne portent que sur les
    // ajouts : sur l'onglet des retraits, ils ne feraient rien.
    onTab: (id) => {
      const kind = MM.el('#kindFilter');
      if (kind) kind.hidden = id !== 'add';
    },
  });

  function renderPanels() {
    const shownAdd = additions.filter(shown).slice(0, ADD_SHOWN);
    const shownCut = removals.filter(underCap);
    MM.el('#count-add').textContent = MM.fmt.int(shownAdd.length);
    MM.el('#count-cut').textContent = MM.fmt.int(shownCut.length);
    MM.el('#panel-add').innerHTML = grid(shownAdd, 'add', priceCap
      ? `Aucun ajout proposé à ${priceCap} € ou moins.`
      : 'Aucun ajout proposé pour ce deck.');
    MM.el('#panel-cut').innerHTML = grid(shownCut, 'cut', priceCap
      ? `Aucun retrait proposé à ${priceCap} € ou moins.`
      : 'Aucun retrait proposé pour ce deck.');
  }

  renderPanels();

  MM.el('#priceFilter').addEventListener('click', (event) => {
    const chip = event.target.closest('.chip');
    if (!chip) return;
    priceCap = chip.dataset.cap ? Number(chip.dataset.cap) : null;
    MM.els('#priceFilter .chip').forEach((other) =>
      other.setAttribute('aria-pressed', String(other === chip)));
    renderPanels();
  });

  MM.el('#kindFilter').addEventListener('click', (event) => {
    const chip = event.target.closest('.chip');
    if (!chip) return;
    const actif = chip.getAttribute('aria-pressed') !== 'true';
    chip.setAttribute('aria-pressed', String(actif));
    if (chip.dataset.hide === 'staples') hideStaples = actif;
    else hideLands = actif;
    renderPanels();
  });

  // Ajout a la buylist, et retrait au second clic : une carte ajoutee par
  // erreur se reprend sans quitter l'analyse.
  MM.el('#panel-add').addEventListener('click', async (event) => {
    const button = event.target.closest('[data-act="buylist"]');
    if (!button) return;
    const name = button.dataset.card;
    const inList = pinned.has(name.toLowerCase());
    button.disabled = true;
    try {
      if (inList) {
        await MM.api.del('/api/v2/buylist/pinned' + MM.api.qs({ card_name: name }));
        pinned.delete(name.toLowerCase());
        MM.toast.ok(`${name} retirée de votre buylist.`);
      } else {
        await MM.api.post('/api/v2/buylist/pinned', { card_name: name });
        pinned.add(name.toLowerCase());
        MM.toast.ok(`${name} ajoutée à votre buylist.`);
      }
      const now = !inList;
      button.classList.toggle('is-done', now);
      button.setAttribute('aria-pressed', String(now));
      button.textContent = now ? 'Dans ma buylist' : 'Ajouter à ma buylist';
      button.title = now ? `Retirer ${name} de votre buylist` : `Ajouter ${name} à votre buylist`;
    } catch (err) {
      MM.toast.error(err.message);
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
