<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Résultats d'analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .gauge { display: flex; align-items: center; gap: var(--sp-4); }
  .gauge__ring {
    --value: 0;
    width: 78px; height: 78px; flex-shrink: 0;
    border-radius: 50%;
    display: grid; place-items: center;
    background: conic-gradient(var(--accent) calc(var(--value) * 1%),
                               var(--surface-3) 0);
    position: relative;
  }
  .gauge__ring::after {
    content: ""; position: absolute; inset: 7px;
    border-radius: 50%; background: var(--bg-raised);
  }
  .gauge__value {
    position: relative; z-index: 1;
    font-family: var(--font-display); font-size: var(--text-xl);
    font-variant-numeric: tabular-nums;
  }

  .gap-row { display: flex; align-items: center; gap: var(--sp-3); padding: 6px 0; }
  .gap-row__label { width: 190px; flex-shrink: 0; font-size: var(--text-sm); }
  .gap-row__track {
    flex: 1; height: 16px; position: relative;
    background: var(--surface); border-radius: var(--r-sm); overflow: hidden;
  }
  .gap-row__deck, .gap-row__meta { position: absolute; top: 0; bottom: 0; }
  .gap-row__meta { background: var(--surface-3); }
  .gap-row__deck { background: var(--accent); opacity: 0.85; }
  .gap-row__delta { width: 68px; text-align: right; font-size: var(--text-xs);
    font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .swap-row {
    display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto;
    gap: var(--sp-3); align-items: center;
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 1px solid var(--line);
  }
  .swap-row:last-child { border-bottom: none; }
  .swap-row:hover { background: var(--surface); }
  .swap-row__side { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
  .swap-row__thumb { width: 34px; aspect-ratio: var(--card-ratio); object-fit: cover;
    border-radius: 3px; background: var(--surface-2); flex-shrink: 0; }
  @media (max-width: 720px) {
    .swap-row { grid-template-columns: 1fr; }
    .swap-row__arrow { display: none; }
  }

  .curve { display: flex; align-items: flex-end; gap: 5px; height: 84px; }
  .curve__bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .curve__fill { width: 100%; background: linear-gradient(180deg, var(--accent), var(--accent-deep));
    border-radius: 3px 3px 0 0; min-height: 2px; }
  .curve__label { font-size: 10px; color: var(--text-3); }
</style>
</head>
<body>

<div id="page">
  <section class="hero" id="hero" style="min-height:200px">
    <div class="hero__body">
      <div class="skeleton skeleton--text" style="width:280px;height:32px"></div>
    </div>
  </section>
  <div id="content">
    <div class="center" style="padding:80px"><span class="spinner spinner--lg"></span></div>
  </div>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const user = await MM.boot({
    title: 'Résultats', nav: 'analyze',
  });
  if (!user) return;

  const params = new URLSearchParams(location.search);
  const algo = params.get('algo') || 'v1';
  const content = MM.el('#content');

  let deckInfo = {};
  try { deckInfo = JSON.parse(sessionStorage.getItem('mm_analysis_deck')) || {}; } catch {}

  function renderHero(subtitle, stats) {
    const art = deckInfo.scryfall_id ? MM.scryfallArt(deckInfo.scryfall_id) : null;
    MM.el('#hero').innerHTML = `
      ${art ? `<div class="hero__art" style="background-image:url('${MM.esc(art)}')"></div>` : ''}
      <div class="hero__body">
        <p class="eyebrow">${MM.esc(deckInfo.commander || 'Analyse')}</p>
        <h2 class="hero__title">${MM.esc(deckInfo.name || "Résultats d’analyse")}</h2>
        <p class="muted">${MM.esc(subtitle)}</p>
        ${stats || ''}
        <div class="hero__actions">
          ${deckInfo.deck_id
            ? `<a class="btn" href="/decks/${encodeURIComponent(deckInfo.deck_id)}">
                 Ouvrir le deck</a>` : ''}
          <a class="btn btn--ghost" href="/decks/analyse">Nouvelle analyse</a>
        </div>
      </div>`;
  }

  function fail(message) {
    renderHero('Analyse indisponible');
    content.innerHTML = MM.empty({
      icon: 'warning', title: 'Résultats indisponibles', text: message,
      action: { href: '/decks/analyse', label: 'Relancer une analyse' },
    });
  }

  /* ═══ Analyse par intelligence artificielle ═══════════════════════════ */

  if (algo === 'hybrid') {
    let result;
    try {
      result = JSON.parse(sessionStorage.getItem('deckMentorResult'));
    } catch { result = null; }
    if (!result) return fail("Les résultats n'ont pas été trouvés. Relancez l'analyse.");

    const score = Math.round((result.deck_score || 0) * 100);
    const coherence = Math.round((result.coherence || 0) * 100);
    const distance = Math.round((result.distance_meta || 0) * 100);

    renderHero('Analyse par le moteur d\'intelligence artificielle', `
      <div class="hero__stats">
        <span class="hero__stat"><b>${score} / 100</b>
          <span class="muted small">score du deck</span></span>
        <span class="hero__stat"><b>${coherence} %</b>
          <span class="muted small">cohérence interne</span></span>
        <span class="hero__stat"><b>${distance} %</b>
          <span class="muted small">écart à la méta</span></span>
      </div>`);

    const names = [
      ...(result.top_additions || []).map((c) => c.card_name),
      ...(result.top_cuts || []).map((c) => c.card_name),
      ...(result.replacements || []).flatMap((r) => [r.cut_card, r.add_card]),
    ].filter(Boolean);
    const resolved = await MM.resolveCards(names);

    const thumb = (name) => {
      const info = resolved[name] || {};
      return info.image_small
        ? `<img class="swap-row__thumb" src="${MM.esc(info.image_small)}" alt="" loading="lazy">`
        : '<span class="swap-row__thumb"></span>';
    };

    const gaps = (result.gap || []).slice(0, 10);
    const curve = (result.profile && result.profile.mana_curve) || {};
    const curveKeys = Object.keys(curve).sort((a, b) => Number(a) - Number(b));
    const curveMax = Math.max(...curveKeys.map((k) => curve[k]), 1);

    content.innerHTML = `
      <div class="grid-2" style="align-items:start">
        <div class="stack-6">
          <div class="panel">
            <div class="panel__head">
              <h2 class="h3">Remplacements suggérés</h2>
              <span class="badge">${(result.replacements || []).length}</span>
            </div>
            <div class="panel__body panel__body--flush">
              ${(result.replacements || []).length ? (result.replacements || []).slice(0, 20)
                .map((swap) => `
                  <div class="swap-row">
                    <span class="swap-row__side">
                      ${thumb(swap.cut_card)}
                      <span class="truncate small" style="color:var(--danger)">
                        ${MM.esc(swap.cut_card)}</span>
                    </span>
                    <span class="swap-row__arrow accent">→</span>
                    <span class="swap-row__side">
                      ${thumb(swap.add_card)}
                      <span class="truncate small accent">${MM.esc(swap.add_card)}</span>
                    </span>
                    <span class="xs dim num">+${(swap.gain_delta || 0).toFixed(0)}</span>
                  </div>`).join('')
                : '<p class="muted small" style="padding:var(--sp-5)">Aucun remplacement proposé.</p>'}
            </div>
          </div>

          <div class="panel">
            <div class="panel__head">
              <h2 class="h3">Ajouts recommandés</h2>
              <span class="badge">${(result.top_additions || []).length}</span>
            </div>
            <div class="panel__body">
              <div class="card-grid card-grid--sm">
                ${(result.top_additions || []).slice(0, 24).map((card) => `
                  <article class="mtg-card mtg-card--flat">
                    <div class="mtg-card__frame">
                      ${MM.img.frame({ card_name: card.card_name, ...(resolved[card.card_name] || {}) })}
                    </div>
                    <div class="mtg-card__foot">
                      <span class="mtg-card__name">${MM.esc(card.card_name)}</span>
                      <span class="mtg-card__meta">
                        <span class="dim">${((card.addition_score || 0) * 100).toFixed(0)} pts</span>
                        ${(resolved[card.card_name] || {}).unit_price != null
                          ? `<span class="mtg-card__price">${
                              MM.fmt.eur(resolved[card.card_name].unit_price)}</span>` : ''}
                      </span>
                    </div>
                  </article>`).join('')}
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel__head">
              <h2 class="h3">Retraits suggérés</h2>
              <span class="badge">${(result.top_cuts || []).length}</span>
            </div>
            <div class="panel__body">
              <div class="card-grid card-grid--sm">
                ${(result.top_cuts || []).slice(0, 24).map((card) => `
                  <article class="mtg-card mtg-card--flat">
                    <div class="mtg-card__frame">
                      ${MM.img.frame({ card_name: card.card_name, ...(resolved[card.card_name] || {}) })}
                    </div>
                    <div class="mtg-card__foot">
                      <span class="mtg-card__name">${MM.esc(card.card_name)}</span>
                      <span class="mtg-card__meta">
                        <span class="dim">${((card.cut_score || 0) * 100).toFixed(0)} pts</span>
                      </span>
                    </div>
                  </article>`).join('')}
              </div>
            </div>
          </div>
        </div>

        <div class="stack-6">
          <div class="panel">
            <div class="panel__head"><h2 class="h3">Score global</h2></div>
            <div class="panel__body stack">
              <div class="gauge">
                <div class="gauge__ring" style="--value:${score}">
                  <span class="gauge__value">${score}</span>
                </div>
                <div class="stack-2">
                  <p class="small">Cohérence <strong>${coherence} %</strong></p>
                  <p class="small">Écart à la méta <strong>${distance} %</strong></p>
                  <p class="xs dim">Plus l'écart est faible, plus le deck ressemble
                    à ce qui se joue habituellement.</p>
                </div>
              </div>
            </div>
          </div>

          ${curveKeys.length ? `
            <div class="panel">
              <div class="panel__head"><h2 class="h3">Courbe de mana</h2></div>
              <div class="panel__body">
                <div class="curve">
                  ${curveKeys.map((key) => `
                    <span class="curve__bar" title="${curve[key]} cartes à ${key}">
                      <span class="curve__fill"
                            style="height:${(curve[key] / curveMax) * 60}px"></span>
                      <span class="curve__label">${MM.esc(key)}</span>
                    </span>`).join('')}
                </div>
              </div>
            </div>` : ''}

          ${gaps.length ? `
            <div class="panel">
              <div class="panel__head">
                <div class="stack-2">
                  <h2 class="h3">Écarts par famille</h2>
                  <p class="xs dim">Votre deck comparé à la moyenne des decks du
                    même commandant.</p>
                </div>
              </div>
              <div class="panel__body">
                ${gaps.map((gap) => {
                  const deck = (gap.deck_share || 0) * 100;
                  const meta = (gap.meta_share || 0) * 100;
                  const max = Math.max(deck, meta, 1);
                  const delta = (gap.delta || 0) * 100;
                  return `
                    <div class="gap-row">
                      <span class="gap-row__label truncate"
                            title="${MM.esc(gap.cluster_name)}">
                        ${MM.esc(gap.cluster_name)}</span>
                      <span class="gap-row__track">
                        <span class="gap-row__meta" style="width:${(meta / max) * 100}%"></span>
                        <span class="gap-row__deck" style="width:${(deck / max) * 100}%"></span>
                      </span>
                      <span class="gap-row__delta ${delta < 0 ? 'accent' : 'dim'}">
                        ${delta > 0 ? '+' : ''}${delta.toFixed(1)} pt</span>
                    </div>`;
                }).join('')}
                <p class="xs dim" style="margin-top:var(--sp-3)">
                  Barre claire : la méta. Barre dorée : votre deck.
                  Un écart négatif signale une famille sous-représentée chez vous.
                </p>
              </div>
            </div>` : ''}
        </div>
      </div>`;
    return;
  }

  /* ═══ Analyse par popularité (CSV) ════════════════════════════════════ */

  const csv = params.get('csv');
  if (!csv) return fail('Aucun résultat à afficher.');

  let rows;
  try {
    const response = await fetch(csv);
    if (!response.ok) throw new Error('Fichier de résultats introuvable');
    rows = parseCsv(await response.text());
  } catch (err) {
    return fail(err.message);
  }

  /** Le script de recommandation produit un CSV Section,Card Name,Score,Support,… */
  function parseCsv(text) {
    const lines = text.replace(/^﻿/, '').replace(/\r/g, '').split('\n')
      .filter((line) => line.trim().length);
    if (!lines.length) return [];

    const split = (line) => {
      const cells = [];
      let current = '';
      let quoted = false;
      for (let i = 0; i < line.length; i += 1) {
        const char = line[i];
        if (quoted) {
          if (char === '"') {
            if (line[i + 1] === '"') { current += '"'; i += 1; } else quoted = false;
          } else current += char;
        } else if (char === '"') quoted = true;
        else if (char === ',') { cells.push(current); current = ''; }
        else current += char;
      }
      cells.push(current);
      return cells;
    };

    const headers = split(lines[0]).map((h) => h.trim().toLowerCase().replace(/\s+/g, '_'));
    const at = (cells, name) => (cells[headers.indexOf(name)] || '').trim();

    return lines.slice(1).map(split)
      .map((cells) => ({
        section: at(cells, 'section') || cells[0] || '',
        name: at(cells, 'card_name') || cells[1] || '',
        score: at(cells, 'score'),
        support: at(cells, 'support'),
        frequency: at(cells, 'deck_frequency'),
      }))
      .filter((row) => row.name);
  }

  // Le CSV mêle des en-têtes de section ("Additions", "Removals") et les lignes
  // de données, dont la colonne Section vaut "add" ou "remove".
  const inSection = (row, ...labels) => {
    const section = row.section.trim().toLowerCase();
    return labels.some((label) => section === label);
  };

  const commander = rows.find((row) => inSection(row, 'commander'));
  const additions = rows.filter((row) => inSection(row, 'add', 'addition'));
  const removals = rows.filter((row) => inSection(row, 'remove', 'removal', 'cut'));

  if (commander && !deckInfo.commander) deckInfo.commander = commander.name;

  const resolved = await MM.resolveCards(
    [...additions, ...removals].map((row) => row.name).concat(
      commander ? [commander.name] : []));

  if (!deckInfo.scryfall_id && commander && resolved[commander.name]) {
    deckInfo.scryfall_id = resolved[commander.name].scryfall_id;
  }

  renderHero('Analyse fondée sur la popularité réelle des cartes', `
    <div class="hero__stats">
      <span class="hero__stat"><b>${MM.fmt.int(additions.length)}</b>
        <span class="muted small">ajouts proposés</span></span>
      <span class="hero__stat"><b>${MM.fmt.int(removals.length)}</b>
        <span class="muted small">retraits proposés</span></span>
    </div>`);

  /** Vignette d'une carte proposee, avec le lien marchand qui va avec. */
  const tile = (row, kind) => {
    const info = resolved[row.name] || {};
    return `
      <article class="mtg-card">
        <div class="mtg-card__frame">
          ${MM.img.frame({ card_name: row.name, ...info })}
          ${info.owned ? `<span class="mtg-card__qty"
            title="Déjà en collection">${info.owned}</span>` : ''}
        </div>
        <div class="mtg-card__foot">
          <span class="mtg-card__name" title="${MM.esc(row.name)}">
            ${MM.esc(row.name)}</span>
          <span class="mtg-card__meta">
            ${row.frequency
              ? `<span class="dim" title="Part des decks du commandant">
                   ${MM.esc(row.frequency)} %</span>`
              : (row.score ? `<span class="dim"
                   title="Score de recommandation">${MM.esc(row.score)}</span>` : '')}
            ${info.unit_price != null
              ? `<span class="mtg-card__price">${MM.fmt.eur(info.unit_price)}</span>`
              : ''}
          </span>
          <span class="mtg-card__market">
            ${kind === 'add'
              ? `<a class="btn btn--sm btn--outline" target="_blank" rel="noopener"
                    href="${MM.esc(MM.market.buy(row.name))}"
                    title="Voir les offres d'achat de ${MM.esc(row.name)} sur Cardmarket"
                   >Acheter</a>`
              : `<a class="btn btn--sm" target="_blank" rel="noopener"
                    href="${MM.esc(MM.market.sell(row.name))}"
                    title="Proposer ${MM.esc(row.name)} à la vente sur RELIC-TRADE"
                   >Vendre</a>`}
          </span>
        </div>
      </article>`;
  };

  const grid = (list, kind, empty) => list.length
    ? `<div class="card-grid">${list.map((row) => tile(row, kind)).join('')}</div>`
    : `<p class="muted small">${empty}</p>`;

  // Les deux listes deviennent deux onglets plutot que deux panneaux empiles.
  content.innerHTML = `
    <div class="stack-2">
      <div class="chips" id="tabs" role="tablist">
        <button class="chip" data-tab="add" aria-pressed="true">
          Cartes à ajouter <span class="chip__count">${additions.length}</span></button>
        <button class="chip" data-tab="cut" aria-pressed="false">
          Cartes à retirer <span class="chip__count">${removals.length}</span></button>
      </div>
      <div id="panel-add">
        ${grid(additions, 'add', 'Aucun ajout proposé pour ce deck.')}
      </div>
      <div id="panel-cut" hidden>
        ${grid(removals, 'cut', 'Aucun retrait proposé pour ce deck.')}
      </div>
    </div>`;

  MM.el('#tabs').addEventListener('click', (event) => {
    const chip = event.target.closest('.chip');
    if (!chip) return;
    MM.els('#tabs .chip').forEach((other) =>
      other.setAttribute('aria-pressed', String(other === chip)));
    MM.el('#panel-add').hidden = chip.dataset.tab !== 'add';
    MM.el('#panel-cut').hidden = chip.dataset.tab !== 'cut';
  });
})();
</script>
</body>
</html>
