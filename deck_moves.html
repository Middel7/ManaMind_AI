<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Cartes mal placées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .move {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr) auto;
    gap: var(--sp-4);
    align-items: center;
    padding: var(--sp-3) var(--sp-4);
    border-radius: var(--r-lg);
    border: 1px solid var(--line);
    background: var(--bg-raised);
    transition: border-color var(--dur) var(--ease);
  }
  .move:hover { border-color: var(--line-accent); }
  .move__thumb { width: 64px; aspect-ratio: var(--card-ratio); object-fit: cover;
    border-radius: 4px; background: var(--surface-2); }

  .move__flow { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .move__side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .move__arrow { color: var(--accent); flex-shrink: 0; }
  .move__gain {
    text-align: right; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 720px) {
    .move { grid-template-columns: 48px minmax(0, 1fr); }
    .move__thumb { width: 48px; }
    .move__gain { grid-column: 1 / -1; text-align: left; }
  }
</style>
</head>
<body>

<div id="page">
  <div class="stack-2">
    <h2 class="h2">Cartes mal placées</h2>
    <p class="muted small">
      Ces cartes sont dans un de vos decks alors qu'elles seraient statistiquement
      bien plus à leur place dans un autre. Comparaison fondée sur les taux
      d'inclusion réels de chaque commandant.
    </p>
  </div>

  <div class="toolbar">
    <div class="field" style="width:auto">
      <label class="label" for="topCount">Nombre de propositions</label>
      <select class="select" id="topCount">
        <option value="30">30</option>
        <option value="60" selected>60</option>
        <option value="120">120</option>
      </select>
    </div>
  </div>

  <div id="summary"></div>
  <div id="results"></div>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const user = await MM.boot({ title: 'Cartes mal placées', nav: 'moves' });
  if (!user) return;

  const results = MM.el('#results');
  let moves = [];
  let resolved = {};

  MM.el('#topCount').addEventListener('change', load);

  async function load() {
    const top = MM.el('#topCount').value;
    results.innerHTML = `<div class="stack">${Array.from({ length: 8 }, () =>
      '<div class="skeleton" style="height:92px"></div>').join('')}</div>`;

    try {
      const data = await MM.api.get(`/api/deck-moves?top=${top}`);
      moves = data.results || [];
      resolved = await MM.resolveCards(moves.map((move) => move.card_name));
      render(data);
    } catch (err) {
      results.innerHTML = MM.empty({
        icon: 'warning', title: 'Analyse impossible', text: err.message });
    }
  }

  function render(data) {
    const stats = data.stats || {};
    MM.el('#summary').innerHTML = `
      <div class="stats">
        <div class="stat">
          <span class="stat__value">${MM.fmt.int(moves.length)}</span>
          <span class="stat__label">Déplacements suggérés</span>
        </div>
        <div class="stat">
          <span class="stat__value">${MM.fmt.int(stats.decks_analyzed || 0)}</span>
          <span class="stat__label">Decks analysés</span>
        </div>
        <div class="stat">
          <span class="stat__value">${MM.fmt.int(stats.cards_scanned || 0)}</span>
          <span class="stat__label">Cartes examinées</span>
        </div>
      </div>`;

    if (!moves.length) {
      results.innerHTML = MM.empty({
        icon: 'check',
        title: 'Vos cartes sont bien placées',
        text: 'Aucune carte de vos decks ne serait nettement mieux employée ailleurs.',
      });
      return;
    }

    results.innerHTML = `<div class="stack-2">${moves.map((move, index) => {
      const info = resolved[move.card_name] || {};
      return `
        <article class="move" data-index="${index}">
          ${info.image_small
            ? `<img class="move__thumb" src="${MM.esc(info.image_small)}"
                 alt="${MM.esc(move.card_name)}" loading="lazy">`
            : '<span class="move__thumb"></span>'}
          <div style="min-width:0">
            <p class="strong truncate">${MM.esc(move.card_name)}
              ${info.unit_price != null
                ? `<span class="xs dim num">· ${MM.fmt.eur(info.unit_price)}</span>` : ''}</p>
            <div class="move__flow">
              <span class="move__side">
                <span class="xs dim">Actuellement dans</span>
                <span class="small truncate">${MM.esc(move.from_commander)}
                  <span class="dim num">${move.from_rate.toFixed(1)} %</span></span>
              </span>
              <span class="move__arrow">→</span>
              <span class="move__side">
                <span class="xs dim">Serait mieux dans</span>
                <span class="small truncate accent">${MM.esc(move.to_commander)}
                  <span class="num">${move.to_rate.toFixed(1)} %</span></span>
              </span>
            </div>
          </div>
          <div class="move__gain">
            <p class="h3 accent">+${move.gain.toFixed(0)} pts</p>
            <p class="xs dim">${MM.fmt.int(move.decks_with_card)} /
              ${MM.fmt.int(move.total_decks)} decks</p>
            <button class="btn btn--sm" data-move="${index}"
                    style="margin-top:6px">Déplacer</button>
          </div>
        </article>`;
    }).join('')}</div>`;
  }

  results.addEventListener('click', async (event) => {
    const button = event.target.closest('[data-move]');
    if (!button) return;
    const move = moves[Number(button.dataset.move)];

    const ok = await MM.confirm({
      title: 'Déplacer cette carte ?',
      text: `« ${move.card_name} » sera retirée de ${move.from_commander} `
        + `et ajoutée à ${move.to_commander}.`,
      confirmLabel: 'Déplacer',
    });
    if (!ok) return;

    button.disabled = true;
    button.textContent = 'Déplacement…';
    try {
      await MM.api.post('/api/deck-card/remove', {
        commander: move.from_commander, card_name: move.card_name,
      });
      await MM.api.post('/api/deck-card/add', {
        commander: move.to_commander, card_name: move.card_name,
      });
      button.closest('.move').style.opacity = '0.45';
      button.textContent = 'Déplacée ✓';
      MM.toast.ok(`${move.card_name} déplacée vers ${move.to_commander}.`);
    } catch (err) {
      MM.toast.error(err.message);
      button.disabled = false;
      button.textContent = 'Déplacer';
    }
  });

  load();
})();
</script>
</body>
</html>
