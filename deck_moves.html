<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Cartes à changer de deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  /* Le trajet d'une carte, lisible sous sa vignette. Les noms de commandants
     s'ecrivent en entier : tronques, ils devenaient indistinguables entre deux
     versions d'un meme commandant. */
  .move__flow { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .move__flow > span {
    white-space: normal;
    overflow-wrap: anywhere;
    line-height: 1.35;
  }
  .move__gain {
    position: absolute; top: var(--sp-2); left: var(--sp-2);
    padding: 2px var(--sp-2);
    border-radius: var(--r-full);
    background: var(--accent); color: var(--text-inverse);
    font-size: var(--text-xs); font-weight: 700;
  }
  .move--done { opacity: 0.45; }
</style>
</head>
<body>

<div id="page">
  <div class="stack-2">
    <h2 class="h2">Cartes à changer de deck</h2>
    <p class="muted small">
      Ces cartes sont dans un de vos decks alors qu'elles seraient statistiquement
      bien plus à leur place dans un autre. Comparaison fondée sur les taux
      d'inclusion réels de chaque commandant.
    </p>
  </div>

  <div class="toolbar">
    <div class="chips" id="views" role="tablist">
      <button class="chip" data-view="open" aria-pressed="true">Propositions</button>
      <button class="chip" data-view="hidden" aria-pressed="false">
        Écartées <span class="chip__count" id="hiddenCount">0</span></button>
    </div>
    <div class="field" style="width:auto" id="topField">
      <label class="label" for="topCount">Nombre de propositions</label>
      <select class="select" id="topCount">
        <option value="30">30</option>
        <option value="60" selected>60</option>
        <option value="120">120</option>
      </select>
    </div>
  </div>

  <div id="results"></div>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const user = await MM.boot({ title: 'Cartes à changer de deck', nav: 'moves' });
  if (!user) return;

  const results = MM.el('#results');
  let moves = [];
  let resolved = {};

  MM.el('#topCount').addEventListener('change', load);

  async function load() {
    const top = MM.el('#topCount').value;
    results.innerHTML = `<div class="card-grid card-grid--lg">${MM.cardSkeletons(12)}</div>`;

    try {
      const data = await MM.api.get(`/api/deck-moves?top=${top}`);
      moves = data.results || [];
      resolved = await MM.resolveCards(moves.map((move) => move.card_name));
      render();
    } catch (err) {
      results.innerHTML = MM.empty({
        icon: 'warning', title: 'Analyse impossible', text: err.message });
    }
  }

  function render() {
    if (!moves.length) {
      results.innerHTML = MM.empty({
        icon: 'check',
        title: 'Vos cartes sont bien placées',
        text: 'Aucune carte de vos decks ne serait nettement mieux employée ailleurs.',
      });
      return;
    }

    results.innerHTML = `<div class="card-grid">${moves.map((move) => MM.cardTile({
      ...(resolved[move.card_name] || {}),
      card_name: move.card_name,
    }, {
      // Aucun deck courant ici : la carte passe d'un deck a un autre, le
      // reglage n'aurait pas de cible.
      context: null,
      note: `+${move.gain.toFixed(0)} % · ${MM.esc(move.from_commander)}`
        + ` → ${MM.esc(move.to_commander)}`,
      actions: [
        { label: 'Déplacer', act: 'move',
          title: `Retirer de ${MM.esc(move.from_commander)} et ajouter à `
            + `${MM.esc(move.to_commander)}` },
        { label: 'Écarter', act: 'hide', variant: 'ghost',
          title: 'Ne plus proposer ce déplacement' },
      ],
    })).join('')}</div>`;
  }

  /* ── Propositions ecartees ────────────────────────────────────────────── */

  let hidden = [];

  async function loadHidden() {
    try {
      hidden = (await MM.api.get('/api/v2/hidden-moves')).moves || [];
    } catch { hidden = []; }
    MM.el('#hiddenCount').textContent = hidden.length;
  }

  function renderHidden() {
    if (!hidden.length) {
      results.innerHTML = MM.empty({
        icon: 'check', title: 'Aucune proposition écartée',
        text: 'Les déplacements que vous écartez apparaîtront ici, et pourront être remis '
          + 'dans les propositions.' });
      return;
    }
    results.innerHTML = `<div class="rows">${hidden.map((move) => `
      <div class="row">
        <span class="row__main">
          <span class="row__title truncate">${MM.esc(move.card_name)}</span>
          <span class="row__sub">${MM.esc(move.from_commander)}
            → ${MM.esc(move.to_commander)}</span>
        </span>
        <span class="row__aside">
          <button class="btn btn--sm" data-restore="${move.id}">Remettre</button>
        </span>
      </div>`).join('')}</div>`;
  }

  function showView(view) {
    MM.el('#topField').hidden = view !== 'open';
    if (view === 'hidden') renderHidden(); else load();
  }

  MM.el('#views').addEventListener('click', (event) => {
    const chip = event.target.closest('.chip');
    if (!chip) return;
    MM.els('#views .chip').forEach((other) =>
      other.setAttribute('aria-pressed', String(other === chip)));
    showView(chip.dataset.view);
  });

  results.addEventListener('click', async (event) => {
    const restore = event.target.closest('[data-restore]');
    if (restore) {
      restore.disabled = true;
      try {
        await MM.api.del(`/api/v2/hidden-moves/${restore.dataset.restore}`);
        MM.toast.ok('Proposition remise dans la liste.');
        await loadHidden();
        renderHidden();
      } catch (err) { MM.toast.error(err.message); restore.disabled = false; }
      return;
    }

    const skip = event.target.closest('[data-act="hide"]');
    if (skip) {
      const move = moves[Number(skip.dataset.hide)];
      skip.disabled = true;
      try {
        await MM.api.post('/api/v2/hidden-moves', {
          card_name: move.card_name,
          from_commander: move.from_commander,
          to_commander: move.to_commander,
        });
        skip.closest('.mtg-card').remove();
        MM.toast.ok(`${move.card_name} ne sera plus proposée pour ce déplacement.`);
        await loadHidden();
      } catch (err) { MM.toast.error(err.message); skip.disabled = false; }
      return;
    }

    const button = event.target.closest('[data-act="move"]');
    if (!button) return;
    const move = moves[Number(button.dataset.move)];

    const ok = await MM.confirm({
      title: 'Déplacer cette carte ?',
      text: `« ${move.card_name} » sera retirée de ${move.from_commander} `
        + `et ajoutée à ${move.to_commander}.`,
      confirmLabel: 'Déplacer',
    });
    if (!ok) return;

    button.disabled = true;
    button.textContent = 'Déplacement…';
    try {
      await MM.api.post('/api/deck-card/remove', {
        commander: move.from_commander, card_name: move.card_name,
      });
      await MM.api.post('/api/deck-card/add', {
        commander: move.to_commander, card_name: move.card_name,
      });
      button.closest('.mtg-card').classList.add('move--done');
      button.textContent = 'Déplacée ✓';
      MM.toast.ok(`${move.card_name} déplacée vers ${move.to_commander}.`);
    } catch (err) {
      MM.toast.error(err.message);
      button.disabled = false;
      button.textContent = 'Déplacer';
    }
  });

  loadHidden();
  load();
})();
</script>
</body>
</html>
