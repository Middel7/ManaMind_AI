<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .curve { display: flex; align-items: flex-end; gap: 4px; height: 68px; }
  .curve__bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .curve__fill {
    width: 100%;
    background: linear-gradient(180deg, var(--accent), var(--accent-deep));
    border-radius: 3px 3px 0 0;
    min-height: 2px;
    transition: height var(--dur-slow) var(--ease-out);
  }
  .curve__label { font-size: 10px; color: var(--text-3); }

  .type-group { margin-bottom: var(--sp-6); }
  .type-group__head {
    display: flex; align-items: baseline; gap: var(--sp-3);
    padding-bottom: var(--sp-2); margin-bottom: var(--sp-3);
    border-bottom: 1px solid var(--line);
  }

  .card-line {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 5px var(--sp-2);
    border-radius: var(--r-sm);
    transition: background var(--dur-fast) var(--ease);
  }
  .card-line:hover { background: var(--surface); }
  /* La quantite s'ajuste sur place — un deck compte plusieurs terrains de
     base. Les boutons ne paraissent qu'au survol : permanents, ils
     alourdiraient une liste de cent lignes. */
  .card-line__qty {
    display: inline-flex; align-items: center; gap: 2px;
    min-width: 56px; justify-content: flex-end;
  }
  .card-line__qty output {
    min-width: 18px; text-align: right;
    font-variant-numeric: tabular-nums; color: var(--text-3); font-size: var(--text-sm);
  }
  .card-line__qty button {
    width: 18px; height: 18px; display: grid; place-items: center;
    border-radius: var(--r-sm); border: 1px solid var(--line-strong);
    color: var(--text-2); font-size: 12px; line-height: 1;
    opacity: 0; transition: opacity var(--dur-fast) var(--ease);
  }
  .card-line:hover .card-line__qty button,
  .card-line__qty button:focus-visible { opacity: 1; }
  .card-line__qty button:hover { background: var(--surface-2); color: var(--text); }
  .card-line__name { flex: 0 1 auto; min-width: 0; font-size: var(--text-sm); }
  .card-line--missing .card-line__name { color: var(--accent); }
  /* Le retrait etait invisible hors survol : on le montre en permanence,
     en retrait, et il s'affirme au survol de la ligne. */
  .card-line__remove { opacity: 0.4; transition: opacity var(--dur-fast) var(--ease); }
  .card-line:hover .card-line__remove { opacity: 1; }
  .card-line__setcmd { opacity: 0.4; transition: opacity var(--dur-fast) var(--ease); }
  .card-line:hover .card-line__setcmd { opacity: 1; }

  /* Apercu de la carte au survol, comme sur les sites de decklists */
  .peek {
    position: fixed; z-index: var(--z-modal);
    width: 244px; pointer-events: none;
    border-radius: 4.6% / 3.3%;
    box-shadow: var(--shadow-lg);
    display: none;
  }
  @media (hover: none) { .peek { display: none !important; } }
  /* Place du badge « a acquerir », reservee meme quand il est absent :
     sinon les boutons d'action sautaient d'une ligne a l'autre. */
  .card-line__spacer { width: 74px; flex-shrink: 0; }
  .card-line .badge--link { width: 74px; flex-shrink: 0; justify-content: center;
                            display: inline-flex; }

  /* La courbe de mana tient dans le bandeau, sous les chiffres du deck */
  .hero__curve { max-width: 420px; margin: var(--sp-2) 0 0; }


  /* Badge cliquable : « a acquerir » mene a l'offre Cardmarket de la carte */
  .badge--link { text-decoration: none; cursor: pointer; }
  .badge--link:hover { filter: brightness(1.25); }
</style>
</head>
<body>

<div id="page">
  <section class="hero" id="hero" style="min-height:240px">
    <div class="hero__body">
      <div class="skeleton skeleton--text" style="width:320px;height:36px"></div>
      <div class="skeleton skeleton--text" style="width:220px;margin-top:12px"></div>
    </div>
  </section>

  <div id="content"></div>
</div>

<img class="peek" id="peek" alt="">

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const deckId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());

  const user = await MM.boot({ title: 'Deck', nav: 'decks' });
  if (!user) return;

  let data;
  try {
    data = await MM.api.get(`/api/v2/decks/${encodeURIComponent(deckId)}`);
  } catch (err) {
    MM.el('#hero').innerHTML = `<div class="hero__body">
      <h2 class="hero__title">Deck introuvable</h2>
      <p class="muted">${MM.esc(err.message)}</p>
      <div class="hero__actions"><a class="btn" href="/decks">Retour à mes decks</a></div>
    </div>`;
    return;
  }

  const deck = data.deck;
  let cards = data.cards;
  document.title = `ManaMind — ${deck.name}`;

  /* ── Hero ─────────────────────────────────────────────────────────────── */

  function renderHero() {
    const commanderCard = cards.find((card) =>
      card.card_name.toLowerCase() === (deck.commander || '').toLowerCase())
      || cards.find((card) => card.scryfall_id);
    const art = commanderCard && commanderCard.scryfall_id
      ? MM.scryfallArt(commanderCard.scryfall_id) : null;
    const missing = deck.card_count - deck.owned_count;

    MM.el('#hero').innerHTML = `
      ${art ? `<div class="hero__art" style="background-image:url('${MM.esc(art)}')"></div>` : ''}
      <div class="hero__body">
        <div class="hero__split">
        <div class="grow">
        <p class="eyebrow">${MM.esc(deck.commander || 'Deck')}</p>
        <h2 class="hero__title">${MM.esc(deck.name)}</h2>
        <div class="hero__stats">
          <span class="hero__stat"><b>${MM.fmt.int(deck.card_count)}</b>
            <span class="muted small">cartes</span></span>
          <span class="hero__stat"><b>${Math.round(deck.owned_ratio * 100)} %</b>
            <span class="muted small">en collection</span></span>
          ${missing ? `<span class="hero__stat"><b class="accent">${MM.fmt.int(missing)}</b>
            <span class="muted small">manquantes</span></span>` : ''}
          <span class="hero__stat"><b>${MM.fmt.int(MM.mana.lands(cards).front)}</b>
            <span class="muted small">terrains</span></span>
          <span class="hero__stat"><b>${MM.fmt.eur(deck.value_eur, { compact: true })}</b>
            <span class="muted small">de valeur</span></span>
        </div>
        <div class="hero__curve">${manaCurve(cards)}</div>
        </div>
        <div class="hero__actions">
          <a class="btn btn--primary" href="/decks/ameliorer?deck=${encodeURIComponent(deckId)}"
             title="Cartes de votre collection qui amélioreraient ce deck">
            ${MM.icons.sparkle} Améliorer avec ma collection</a>
          <a class="btn" href="/decks/analyse?deck=${encodeURIComponent(deckId)}"
             title="Analyser le deck : ajouts et retraits suggérés, sans se limiter à
                    votre collection">
            ${MM.icons.chart} Améliorer avec l'analyse</a>
        </div>
        </div>
      </div>`;
  }

  /* ── Regroupement par type ────────────────────────────────────────────── */

  const TYPE_ORDER = [
    ['Commandant', (card) =>
      card.card_name.toLowerCase() === (deck.commander || '').toLowerCase()],
    ['Créatures', (card) => /Creature/i.test(card.type_line)],
    ['Éphémères', (card) => /Instant/i.test(card.type_line)],
    ['Rituels', (card) => /Sorcery/i.test(card.type_line)],
    ['Artefacts', (card) => /Artifact/i.test(card.type_line)],
    ['Enchantements', (card) => /Enchantment/i.test(card.type_line)],
    ['Planeswalkers', (card) => /Planeswalker/i.test(card.type_line)],
    ['Terrains', (card) => /Land/i.test(card.type_line)],
    ['Autres', () => true],
  ];

  function group(list) {
    const groups = [];
    const remaining = list.slice();
    TYPE_ORDER.forEach(([label, test]) => {
      const matched = [];
      for (let i = remaining.length - 1; i >= 0; i -= 1) {
        if (test(remaining[i])) matched.unshift(remaining.splice(i, 1)[0]);
      }
      if (matched.length) {
        groups.push([label, matched.sort((a, b) =>
          a.card_name.localeCompare(b.card_name, 'fr'))]);
      }
    });
    return groups;
  }

  function manaCurve(list) {
    const buckets = [0, 0, 0, 0, 0, 0, 0, 0];
    list.forEach((card) => {
      if (/Land/i.test(card.type_line)) return;
      const value = Math.min(7, Math.floor(card.mana_value ?? 0));
      buckets[value] += card.quantity;
    });
    const max = Math.max(...buckets, 1);
    return `<div class="curve">${buckets.map((count, index) => `
      <span class="curve__bar" title="${count} carte${count > 1 ? 's' : ''} à ${index}${index === 7 ? '+' : ''}">
        <span class="curve__fill" style="height:${(count / max) * 46}px"></span>
        <span class="curve__label">${index === 7 ? '7+' : index}</span>
      </span>`).join('')}</div>`;
  }

  function render() {
    renderHero();
    const missing = cards.filter((card) => card.owned < card.quantity);

    MM.el('#content').innerHTML = `
      <div class="stack-6">
        <div class="panel">
          <div class="panel__head">
            <h2 class="h3">Liste du deck</h2>
            <div class="cluster-2">
              <button class="btn btn--sm" id="addCard">Ajouter une carte</button>
              ${missing.length ? `<button class="btn btn--sm" id="exportMissing">
                Exporter les ${MM.fmt.int(missing.length)} cartes à acquérir</button>` : ''}
              <button class="btn btn--sm btn--ghost" id="exportDeck">Exporter le deck</button>
            </div>
          </div>
          <div class="panel__body" id="cardList"></div>
        </div>

        <div class="panel">
          <div class="panel__head"><h2 class="h3">Réglages</h2></div>
          <div class="panel__body stack">
            <div class="field" style="max-width:420px">
              <label class="label" for="deckName">Nom du deck</label>
              <input class="input" id="deckName" type="text"
                     value="${MM.esc(deck.name)}" maxlength="120">
            </div>
            <div class="cluster-2">
              <button class="btn btn--sm" id="renameDeck">Renommer</button>
              ${deck.url ? `<a class="btn btn--sm btn--ghost" href="${MM.esc(deck.url)}"
                target="_blank" rel="noopener">Voir la source ${MM.icons.external}</a>` : ''}
              <button class="btn btn--sm btn--danger" id="deleteDeck">Supprimer ce deck</button>
            </div>
          </div>
        </div>
      </div>`;

    renderCards();
    bind();
  }

  function renderCards() {
    MM.el('#cardList').innerHTML = group(cards).map(([label, list]) => {
      const copies = list.reduce((sum, card) => sum + card.quantity, 0);
      return `
        <div class="type-group">
          <div class="type-group__head">
            <h3 class="h4">${MM.esc(label)}</h3>
            <span class="xs dim">${copies}</span>
          </div>
          ${list.map((card) => `
            <div class="card-line ${card.owned < card.quantity ? 'card-line--missing' : ''}"
                 data-name="${MM.esc(card.card_name)}"
                 data-image="${MM.esc(card.image_normal || '')}">
              <span class="card-line__qty">
                <button data-qty="dec" data-name="${MM.esc(card.card_name)}"
                        aria-label="Retirer un exemplaire de ${MM.esc(card.card_name)}">−</button>
                <output>${card.quantity}</output>
                <button data-qty="inc" data-name="${MM.esc(card.card_name)}"
                        aria-label="Ajouter un exemplaire de ${MM.esc(card.card_name)}">+</button>
              </span>
              <span class="card-line__name truncate">${MM.esc(card.card_name)}</span>
              ${/Legendary/i.test(card.type_line || '')
                && card.card_name.toLowerCase() !== (deck.commander || '').toLowerCase()
                ? `<button class="btn btn--ghost btn--icon btn--sm card-line__setcmd"
                           data-setcmd="${MM.esc(card.card_name)}"
                           title="Définir « ${MM.esc(card.card_name)} » comme commandant de ce deck"
                           aria-label="Définir comme commandant">${MM.icons.crown}</button>` : ''}
              ${card.game_changer
                ? '<span class="badge badge--warn" title="Carte à fort impact">GC</span>' : ''}
              <span class="grow"></span>
              <span class="xs dim num" style="min-width:52px;text-align:right">
                ${card.unit_price != null ? MM.fmt.eur(card.unit_price) : '—'}</span>
              ${card.owned < card.quantity
                ? `<a class="badge badge--warn badge--link" target="_blank" rel="noopener"
                      href="${MM.esc(MM.market.buy(card.card_name))}"
                      title="Voir les offres d'achat de ${MM.esc(card.card_name)} sur Cardmarket"
                     >à acquérir</a>`
                : '<span class="card-line__spacer"></span>'}
              <button class="btn btn--ghost btn--icon btn--sm card-line__remove"
                      data-remove="${MM.esc(card.card_name)}"
                      aria-label="Retirer ${MM.esc(card.card_name)}">${MM.icons.close}</button>
            </div>`).join('')}
        </div>`;
    }).join('');
  }

  /** Ajuste d'un exemplaire la carte dans le deck, sans toucher a la
   *  collection. Le compte est repris sur place : le rendu recalcule alors la
   *  courbe, la valeur et les manquantes. */
  async function changeQuantity(name, delta, button) {
    button.disabled = true;
    try {
      await MM.api.post(delta > 0 ? '/api/deck-card/add' : '/api/deck-card/remove',
        { deck_id: deckId, commander: deck.commander, card_name: name });
      const card = cards.find((item) => item.card_name === name);
      if (card) {
        card.quantity += delta;
        if (card.quantity <= 0) cards = cards.filter((item) => item !== card);
      }
      render();
    } catch (err) {
      MM.toast.error(err.message);
      button.disabled = false;
    }
  }

  async function reload() {
    const fresh = await MM.api.get(`/api/v2/decks/${encodeURIComponent(deckId)}`);
    cards = fresh.cards;
    Object.assign(deck, fresh.deck);
    render();
  }

  async function setCommander(name, button) {
    const ok = await MM.confirm({
      title: 'Définir comme commandant ?',
      text: `« ${name} » deviendra le commandant de ${deck.name}`
        + `${deck.commander && deck.commander !== 'Unknown'
            ? `, à la place de « ${deck.commander} »` : ''}.`,
      confirmLabel: 'Définir',
    });
    if (!ok) return;

    button.disabled = true;
    try {
      await MM.api.post(`/api/v2/decks/${encodeURIComponent(deckId)}/commander`,
        { card_name: name });
      MM.toast.ok(`${name} est désormais le commandant de ce deck.`);
      await reload();
    } catch (err) {
      MM.toast.error(err.message);
      button.disabled = false;
    }
  }

  function bind() {
    MM.el('#cardList').addEventListener('click', async (event) => {
      const crown = event.target.closest('[data-setcmd]');
      if (crown) return setCommander(crown.dataset.setcmd, crown);

      const step = event.target.closest('[data-qty]');
      if (step) return changeQuantity(step.dataset.name, step.dataset.qty === 'inc' ? 1 : -1, step);

      const button = event.target.closest('[data-remove]');
      if (!button) return;
      const name = button.dataset.remove;
      const line = cards.find((card) => card.card_name === name);
      const copies = line ? line.quantity : 1;
      const ok = await MM.confirm({
        title: 'Retirer cette carte ?',
        text: `${copies > 1 ? `Les ${copies} exemplaires de « ${name} » seront retirés` : `« ${name} » sera retirée`}`
          + ` de ${deck.name}. Votre collection n'est pas modifiée.`,
        confirmLabel: 'Retirer', danger: true,
      });
      if (!ok) return;
      try {
        await MM.api.post('/api/deck-card/remove',
          { deck_id: deckId, commander: deck.commander, card_name: name, all: true });
        MM.toast('Carte retirée du deck.');
        await reload();
      } catch (err) { MM.toast.error(err.message); }
    });

    MM.el('#addCard').addEventListener('click', () => {
      // La recherche part sur Entree, pas a chaque frappe : les resultats
      // s'affichent en grille, assez grands pour reconnaitre une carte a son
      // illustration avant de l'ajouter.
      const modal = MM.modal({
        title: 'Ajouter une carte au deck',
        wide: true,
        body: `<div class="stack">
                 <div class="field">
                   <label class="label" for="newCard">Nom de la carte</label>
                   <input class="input" id="newCard" type="text" autocomplete="off"
                          placeholder="Tapez un nom puis appuyez sur Entrée">
                 </div>
                 <div id="cardResults"></div>
               </div>`,
      });

      const input = MM.el('#newCard', modal.root);
      const host = MM.el('#cardResults', modal.root);
      input.focus();

      async function search() {
        const term = input.value.trim();
        if (term.length < 2) {
          host.innerHTML = '<p class="muted small">Saisissez au moins deux caractères.</p>';
          return;
        }
        host.innerHTML = `<div class="card-grid">${MM.cardSkeletons(8)}</div>`;
        try {
          const data = await MM.api.get(
            `/api/v2/cards/suggest?q=${encodeURIComponent(term)}&limit=20`);
          const cards = data.cards || [];
          if (!cards.length) {
            host.innerHTML = MM.empty({
              icon: 'search', title: 'Aucune carte trouvée',
              text: `Aucune carte ne correspond à « ${term} ».` });
            return;
          }
          host.innerHTML = `<div class="card-grid">${cards.map((card, index) => `
            <article class="mtg-card" data-pick="${index}" style="cursor:pointer"
                     title="Ajouter ${MM.esc(card.name)} au deck">
              <div class="mtg-card__frame">
                ${MM.img.frame({ card_name: card.name, ...card })}
              </div>
              <div class="mtg-card__foot">
                <span class="mtg-card__name" title="${MM.esc(card.name)}">
                  ${MM.esc(card.name)}</span>
                ${card.printed_name && card.printed_name !== card.name
                  ? `<span class="xs dim truncate" title="Nom trouvé : ${MM.esc(card.printed_name)}"
                      >${MM.esc(card.printed_name)}</span>` : ''}
                <span class="mtg-card__meta">
                  ${card.set_code ? `<span>${MM.esc(card.set_code)}</span>` : ''}
                  ${card.unit_price != null
                    ? `<span class="mtg-card__price">${MM.fmt.eur(card.unit_price)}</span>` : ''}
                </span>
              </div>
            </article>`).join('')}</div>`;

          host.onclick = async (event) => {
            const tile = event.target.closest('[data-pick]');
            if (!tile) return;
            const card = cards[Number(tile.dataset.pick)];
            tile.style.opacity = '0.5';
            try {
              await MM.api.post('/api/deck-card/add',
                { deck_id: deckId, commander: deck.commander, card_name: card.name });
              MM.toast.ok(`${card.name} ajoutée au deck.`);
              modal.close();
              await reload();
            } catch (err) {
              MM.toast.error(err.message);
              tile.style.opacity = '';
            }
          };
        } catch (err) {
          host.innerHTML = MM.empty({
            icon: 'warning', title: 'Recherche impossible', text: err.message });
        }
      }

      input.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        search();
      });
    });

    MM.el('#renameDeck').addEventListener('click', async (event) => {
      const name = MM.el('#deckName').value.trim();
      if (!name) return MM.toast.error('Le nom ne peut pas être vide.');
      event.target.disabled = true;
      try {
        await MM.api.post(`/api/deck-rename/${encodeURIComponent(deckId)}`, { name });
        deck.name = name;
        document.title = `ManaMind — ${name}`;
        renderHero();
        MM.toast.ok('Deck renommé.');
      } catch (err) { MM.toast.error(err.message); }
      finally { event.target.disabled = false; }
    });

    MM.el('#deleteDeck').addEventListener('click', async () => {
      const ok = await MM.confirm({
        title: 'Supprimer ce deck ?',
        text: `${deck.name} et sa liste seront supprimés. Votre collection est conservée.`,
        confirmLabel: 'Supprimer', danger: true,
      });
      if (!ok) return;
      try {
        await MM.api.del(`/api/moxfield-decks/${encodeURIComponent(deckId)}`);
        MM.toast.ok('Deck supprimé.');
        setTimeout(() => { location.href = '/decks'; }, 700);
      } catch (err) { MM.toast.error(err.message); }
    });

    const exportMissing = MM.el('#exportMissing');
    if (exportMissing) {
      exportMissing.addEventListener('click', () => {
        const list = cards.filter((card) => card.owned < card.quantity);
        // Une ligne « quantite nom » : ce que Cardmarket et les want lists
        // attendent. La quantite est celle qu'il reste a acheter.
        const content = list
          .map((card) => `${card.quantity - card.owned} ${card.card_name}`)
          .join('\n');
        const total = list.reduce((sum, card) =>
          sum + (card.unit_price || 0) * (card.quantity - card.owned), 0);
        const modal = MM.modal({
          title: `${list.length} cartes à acquérir · ${MM.fmt.eur(total)}`,
          body: `<textarea class="textarea" readonly style="min-height:320px"
                   id="missingArea">${MM.esc(content)}</textarea>`,
          footer: '<button class="btn btn--primary" data-copy>Copier</button>',
        });
        MM.el('[data-copy]', modal.root).addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(content);
            MM.toast.ok('Liste copiée.');
          } catch {
            MM.el('#missingArea', modal.root).select();
            MM.toast('Sélectionnez puis copiez le texte.');
          }
        });
      });
    }

    MM.el('#exportDeck').addEventListener('click', async () => {
      try {
        const result = await MM.api.get(`/api/deck-txt/${encodeURIComponent(deckId)}`);
        const content = result.content
          || cards.map((card) => `${card.quantity} ${card.card_name}`).join('\n');
        const modal = MM.modal({
          title: 'Exporter la liste',
          body: `<textarea class="textarea" readonly style="min-height:320px"
                   id="exportArea">${MM.esc(content)}</textarea>`,
          footer: '<button class="btn btn--primary" data-copy>Copier</button>',
        });
        MM.el('[data-copy]', modal.root).addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(content);
            MM.toast.ok('Liste copiée.');
          } catch {
            MM.el('#exportArea', modal.root).select();
            MM.toast('Sélectionnez puis copiez le texte.');
          }
        });
      } catch (err) { MM.toast.error(err.message); }
    });
  }

  render();
})();
</script>
</body>
