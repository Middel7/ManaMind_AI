<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>ManaMind — Choisir un deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink-900: #0c0910; --ink-850: #120c1a; --ink-800: #17101f; --ink-700: #1d1529;
    --ink-panel: rgba(20,13,28,0.62);
    --parch-100: #efe6d6; --parch-300: #cdbfa8; --parch-500: #9c8e79; --parch-600: #7c715f;
    --arcane: #a07be0;
    --gold: #c9a45c; --gold-soft: #d8bd83; --gold-line: rgba(201,164,92,0.42); --gold-faint: rgba(201,164,92,0.16);
    --teal: #5cc9b8; --teal-faint: rgba(92,201,184,0.12); --teal-line: rgba(92,201,184,0.35);
    --serif-display: "Cormorant Garamond", Georgia, serif;
    --serif-engraved: "Cinzel", Georgia, serif;
    --serif-body: "Spectral", Georgia, serif;

    /* Couleur d'accent selon le mode — remplacée par JS */
    --accent: var(--gold);
    --accent-faint: var(--gold-faint);
    --accent-line: var(--gold-line);
    --accent-hover: rgba(201,164,92,0.22);
    --accent-soft: var(--gold-soft);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--parch-100); font-family: var(--serif-body); background: var(--ink-900); min-height: 100vh; }

  .page-wrap {
    max-width: 1920px; margin: 0 auto; padding: 32px 48px; min-height: 100vh;
    background: linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 60%);
  }

  header {
    display: flex; align-items: center; gap: 24px;
    padding: 16px 0; border-bottom: 1px solid var(--gold-line); margin-bottom: 32px;
  }
  header a.back {
    font-family: var(--serif-engraved); font-size: 0.72rem; letter-spacing: 0.12em;
    color: var(--gold); text-decoration: none; opacity: 0.8; flex-shrink: 0;
  }
  header a.back:hover { opacity: 1; }
  header h1 {
    margin: 0; flex: 1; text-align: center;
    font-family: var(--serif-display); font-size: clamp(1.4rem,3vw,2rem);
    font-weight: 600; color: var(--parch-100);
  }
  .mode-badge {
    font-family: var(--serif-engraved); font-size: 0.68rem; letter-spacing: 0.1em;
    padding: 3px 10px; border-radius: 12px; margin-left: 12px;
    border: 1px solid var(--accent-line); color: var(--accent); background: var(--accent-faint);
    vertical-align: middle; white-space: nowrap;
  }
  .header-spacer { flex-shrink: 0; visibility: hidden; font-size: 0.72rem; }

  /* Grille */
  .deck-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .deck-card {
    background: var(--ink-panel); border: 1px solid var(--gold-line); border-radius: 10px;
    padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.2s, background 0.2s;
  }
  .deck-card:hover { border-color: var(--accent); background: var(--accent-faint); }

  .deck-header { display: flex; align-items: center; gap: 12px; }
  .cmd-thumb {
    width: 48px; height: 48px; border-radius: 50%;
    object-fit: cover; object-position: 15% 10%;
    border: 1px solid var(--gold-line); flex-shrink: 0; background: var(--ink-800);
  }
  .deck-info { flex: 1; min-width: 0; }
  .deck-commander {
    font-family: var(--serif-display); font-size: 1.05rem; font-weight: 600;
    color: var(--parch-100); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .deck-name {
    font-size: 0.75rem; color: var(--parch-500); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .btn-analyze {
    width: 100%; padding: 10px 16px; border-radius: 6px;
    font-family: var(--serif-engraved); font-size: 0.72rem; letter-spacing: 0.1em;
    cursor: pointer; text-align: center; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent-faint); border: 1px solid var(--accent-line);
    color: var(--accent-soft);
  }
  .btn-analyze:not(:disabled):hover {
    background: var(--accent-hover); border-color: var(--accent); color: var(--accent);
  }
  .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state-msg {
    grid-column: 1 / -1; text-align: center; padding: 60px 20px;
    color: var(--parch-500); font-style: italic;
  }
  .spinner-lg {
    display: inline-block; width: 36px; height: 36px;
    border: 3px solid var(--gold-faint); border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
  }

  #toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    padding: 10px 18px; border-radius: 6px;
    background: var(--ink-700); border: 1px solid rgba(220,60,60,0.5);
    color: var(--parch-100); font-size: 0.85rem;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page-wrap">

  <header>
    <a href="/" class="back">← Accueil</a>
    <h1 id="pageTitle">Choisir un deck</h1>
    <span id="userBadge" style="display:flex;align-items:center;gap:6px;flex-shrink:0;"></span>
  </header>

  <div class="deck-grid" id="deckGrid">
    <div class="state-msg"><div class="spinner-lg"></div><br>Chargement des decks…</div>
  </div>

</div>
<div id="toast"></div>

<script src="/auth-guard.js"></script>
<script>
(() => {
  const grid  = document.getElementById('deckGrid');
  const title = document.getElementById('pageTitle');

  // ── Mode depuis l'URL ─────────────────────────────────────────
  const mode = new URLSearchParams(location.search).get('mode') || 'popular';
  const isIA = mode === 'ia';

  // Adapter titre et couleurs selon le mode
  if (isIA) {
    title.innerHTML = 'Choisir un deck <span class="mode-badge">Intelligence artificielle</span>';
    document.documentElement.style.setProperty('--accent',       '#a07be0');
    document.documentElement.style.setProperty('--accent-faint', 'rgba(160,123,224,0.1)');
    document.documentElement.style.setProperty('--accent-line',  'rgba(160,123,224,0.35)');
    document.documentElement.style.setProperty('--accent-hover', 'rgba(160,123,224,0.2)');
    document.documentElement.style.setProperty('--accent-soft',  '#c4a8f0');
  } else {
    title.innerHTML = 'Choisir un deck <span class="mode-badge">Popularité</span>';
  }

  const LABEL = isIA ? '✧ Analyser avec l\'IA' : '✦ Analyser par popularité';

  // ── Chargement des decks ──────────────────────────────────────
  async function loadDecks() {
    try {
      const res  = await fetch('/api/moxfield-decks');
      const data = await res.json();
      const decks = (data.decks || []).sort((a, b) =>
        (a.commander || '').localeCompare(b.commander || '', 'fr')
      );

      if (decks.length === 0) {
        grid.innerHTML = '<div class="state-msg">Aucun deck configuré.<br><a href="/deck-config" style="color:var(--gold)">Gérer mes decklists →</a></div>';
        return;
      }

      grid.innerHTML = decks.map(d => buildCard(d)).join('');
      decks.forEach(d => loadThumb(d));

      grid.querySelectorAll('.btn-analyze').forEach(btn => {
        btn.addEventListener('click', () => isIA ? analyzeIA(btn) : analyzePopular(btn));
      });

    } catch (e) {
      grid.innerHTML = '<div class="state-msg">Erreur de chargement des decks.</div>';
    }
  }

  function buildCard(deck) {
    return `
      <div class="deck-card">
        <div class="deck-header">
          <img class="cmd-thumb" id="thumb-${esc(deck.deck_id)}"
               src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
               alt="" />
          <div class="deck-info">
            <div class="deck-commander">${esc(deck.commander || '—')}</div>
            <div class="deck-name">${esc(deck.name || deck.deck_id)}</div>
          </div>
        </div>
        <button class="btn-analyze"
                data-deck-id="${esc(deck.deck_id)}"
                data-commander="${esc(deck.commander || '')}">
          ${LABEL}
        </button>
      </div>`;
  }

  async function loadThumb(deck) {
    if (!deck.commander) return;
    const name = deck.commander.includes(' & ')
      ? deck.commander.split(' & ')[0].trim()
      : deck.commander;
    try {
      const r = await fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(name)}`);
      if (!r.ok) return;
      const d = await r.json();
      const url = d.image_uris?.art_crop || d.image_uris?.normal
        || (d.card_faces?.[0]?.image_uris?.art_crop);
      if (url) {
        const img = document.getElementById(`thumb-${deck.deck_id}`);
        if (img) img.src = url;
      }
    } catch (_) {}
  }

  // ── Analyse par popularité ────────────────────────────────────
  async function analyzePopular(btn) {
    const deckId    = btn.dataset.deckId;
    setLoading(btn, true);
    try {
      const txtRes = await fetch(`/api/deck-txt/${encodeURIComponent(deckId)}`);
      if (!txtRes.ok) throw new Error('Deck introuvable');
      const { content } = await txtRes.json();
      if (!content?.trim()) throw new Error('Deck vide');

      const form = new FormData();
      form.append('deckfile', new Blob([content], { type: 'text/plain' }), 'deck.txt');
      form.append('algo', 'v1');

      const upRes  = await fetch('/upload-deck', { method: 'POST', body: form });
      if (!upRes.ok) throw new Error('Erreur analyse');
      const upData = await upRes.json();

      const csvPath = upData.recommendationsFile || upData.csv;
      if (!csvPath) throw new Error('Pas de fichier de résultats');

      window.location.href = `/results?csv=${encodeURIComponent(csvPath)}&algo=v1`;
    } catch (e) {
      setLoading(btn, false);
      showToast(e.message || 'Erreur lors de l\'analyse');
    }
  }

  // ── Analyse par IA ────────────────────────────────────────────
  async function analyzeIA(btn) {
    const deckId    = btn.dataset.deckId;
    const commander = btn.dataset.commander;
    setLoading(btn, true);
    try {
      const txtRes = await fetch(`/api/deck-txt/${encodeURIComponent(deckId)}`);
      if (!txtRes.ok) throw new Error('Deck introuvable');
      const { content } = await txtRes.json();
      if (!content?.trim()) throw new Error('Deck vide');

      const decklist = [];
      for (const line of content.split('\n')) {
        const m = line.trim().match(/^(\d+)\s+(.+)$/);
        if (m) {
          const name = m[2].trim();
          if (name.toLowerCase() !== commander.toLowerCase()) decklist.push(name);
        }
      }
      if (decklist.length === 0) throw new Error('Impossible de parser la decklist');

      const iaRes = await fetch('/api/deck/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ commander, decklist }),
      });
      if (!iaRes.ok) {
        const err = await iaRes.json().catch(() => ({}));
        throw new Error(err.error || 'Erreur analyse IA');
      }

      sessionStorage.setItem('deckMentorResult', JSON.stringify(await iaRes.json()));
      window.location.href = '/results?algo=hybrid';
    } catch (e) {
      setLoading(btn, false);
      showToast(e.message || 'Erreur lors de l\'analyse IA');
    }
  }

  // ── Utilitaires ───────────────────────────────────────────────
  function setLoading(btn, loading) {
    btn.disabled = loading;
    if (loading) btn.innerHTML = `<span class="btn-spinner"></span> Analyse en cours…`;
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  loadDecks();
})();
</script>
</body>
</html>
