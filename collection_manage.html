<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>ManaMind — Ma Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink-900: #0c0910; --ink-850: #120c1a; --ink-800: #17101f; --ink-700: #1d1529;
    --ink-panel: rgba(20, 13, 28, 0.62);
    --parch-100: #efe6d6; --parch-300: #cdbfa8; --parch-500: #9c8e79; --parch-600: #7c715f;
    --arcane: #a07be0; --arcane-deep: #6c4bb0;
    --gold: #c9a45c; --gold-soft: #d8bd83; --gold-line: rgba(201,164,92,0.42); --gold-faint: rgba(201,164,92,0.16);
    --teal: #5cc9b8; --teal-faint: rgba(92,201,184,0.12); --teal-line: rgba(92,201,184,0.35);
    --serif-display: "Cormorant Garamond", Georgia, serif;
    --serif-engraved: "Cinzel", Georgia, serif;
    --serif-body: "Spectral", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--parch-100); font-family: var(--serif-body); background: var(--ink-900); min-height: 100vh; }

  .page-wrap {
    max-width: 1920px; margin: 0 auto; padding: 32px 48px; min-height: 100vh;
    background: linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 60%);
  }

  /* Header */
  header {
    display: flex; align-items: center; gap: 24px;
    padding: 16px 0; border-bottom: 1px solid var(--gold-line); margin-bottom: 24px;
  }
  header a.back {
    font-family: var(--serif-engraved); font-size: 0.72rem; letter-spacing: 0.12em;
    color: var(--gold); text-decoration: none; opacity: 0.8; flex-shrink: 0;
  }
  header a.back:hover { opacity: 1; }
  header h1 {
    margin: 0; flex: 1; text-align: center;
    font-family: var(--serif-display); font-size: clamp(1.4rem,3vw,2rem);
    font-weight: 600; color: var(--parch-100);
  }
  .header-spacer { flex-shrink: 0; visibility: hidden; font-size: 0.72rem; }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .search-wrap {
    position: relative; flex: 1; min-width: 200px; max-width: 420px;
  }
  .search-wrap input {
    width: 100%; padding: 8px 36px 8px 12px;
    background: var(--ink-800); border: 1px solid var(--gold-line);
    border-radius: 6px; color: var(--parch-100);
    font-family: var(--serif-body); font-size: 0.9rem;
    outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-wrap .clear-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--parch-500); cursor: pointer;
    font-size: 1rem; padding: 0; line-height: 1; display: none;
  }

  .filter-group {
    display: flex; align-items: center; gap: 8px;
  }
  .filter-group label {
    font-family: var(--serif-engraved); font-size: 0.68rem;
    letter-spacing: 0.1em; color: var(--parch-500); white-space: nowrap;
  }
  select.ctrl {
    padding: 7px 10px; background: var(--ink-800);
    border: 1px solid var(--gold-line); border-radius: 6px;
    color: var(--parch-100); font-family: var(--serif-body); font-size: 0.85rem;
    outline: none; cursor: pointer;
  }
  select.ctrl:focus { border-color: var(--gold); }

  .stats-bar {
    font-family: var(--serif-engraved); font-size: 0.7rem; letter-spacing: 0.08em;
    color: var(--parch-500); margin-left: auto; white-space: nowrap;
  }
  .stats-bar strong { color: var(--gold); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse;
    font-size: 0.88rem;
  }
  thead th {
    padding: 10px 12px; text-align: left;
    font-family: var(--serif-engraved); font-size: 0.68rem; letter-spacing: 0.1em;
    color: var(--parch-500); border-bottom: 1px solid var(--gold-line);
    white-space: nowrap; user-select: none;
  }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: var(--gold); }
  thead th.sort-active { color: var(--gold); }
  thead th .sort-arrow { margin-left: 4px; opacity: 0.7; }

  tbody tr {
    border-bottom: 1px solid rgba(201,164,92,0.1);
    transition: background 0.15s;
  }
  tbody tr:hover { background: var(--gold-faint); }
  tbody td { padding: 8px 12px; vertical-align: middle; }

  .card-name-cell {
    font-weight: 500; color: var(--parch-100);
    max-width: 280px;
  }
  .card-type {
    font-size: 0.78rem; color: var(--parch-500); margin-top: 2px;
  }

  .mana-cost {
    font-size: 0.78rem; color: var(--parch-300); white-space: nowrap;
    font-family: var(--serif-engraved); letter-spacing: 0.04em;
  }

  .qty-cell { text-align: center; min-width: 90px; }
  .qty-control {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .qty-btn {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid var(--gold-line);
    background: var(--ink-800); color: var(--gold);
    cursor: pointer; font-size: 1rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .qty-btn:hover { background: var(--gold-faint); border-color: var(--gold); }
  .qty-val {
    min-width: 24px; text-align: center;
    font-family: var(--serif-engraved); font-size: 0.9rem; color: var(--parch-100);
  }

  .price-cell {
    text-align: right; white-space: nowrap;
    font-family: var(--serif-engraved); font-size: 0.82rem;
  }
  .price-val { color: var(--gold-soft); }
  .price-loading { color: var(--parch-600); font-size: 0.75rem; }
  .price-total { color: var(--teal); font-size: 0.78rem; margin-top: 2px; }

  .deck-cell { font-size: 0.78rem; color: var(--parch-500); max-width: 220px; }
  .deck-tag {
    display: inline-block; margin: 2px 3px 2px 0;
    padding: 1px 6px; border-radius: 10px;
    background: var(--teal-faint); border: 1px solid var(--teal-line);
    color: var(--teal); font-size: 0.72rem; white-space: nowrap;
  }
  .no-deck { color: var(--parch-600); font-style: italic; }

  .action-cell { text-align: center; }
  .del-btn {
    padding: 4px 10px; border-radius: 4px;
    border: 1px solid rgba(220,60,60,0.4);
    background: transparent; color: rgba(220,100,100,0.8);
    cursor: pointer; font-size: 0.75rem; font-family: var(--serif-engraved);
    letter-spacing: 0.06em; transition: all 0.15s;
  }
  .del-btn:hover {
    background: rgba(220,60,60,0.15);
    border-color: rgba(220,60,60,0.7);
    color: #e06060;
  }

  /* Empty / loading states */
  .state-msg {
    text-align: center; padding: 60px 20px;
    color: var(--parch-500); font-style: italic; font-size: 0.95rem;
  }
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid var(--gold-faint); border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    padding: 10px 18px; border-radius: 6px;
    background: var(--ink-700); border: 1px solid var(--gold-line);
    color: var(--parch-100); font-size: 0.85rem;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page-wrap">

  <header>
    <a href="/" class="back">← Accueil</a>
    <h1>Ma Collection</h1>
    <span id="userBadge" style="display:flex;align-items:center;gap:6px;flex-shrink:0;"></span>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Rechercher une carte…" autocomplete="off" />
      <button class="clear-btn" id="clearBtn" title="Effacer">✕</button>
    </div>

    <div class="filter-group">
      <label>DECK</label>
      <select id="deckFilter" class="ctrl">
        <option value="">Toutes</option>
        <option value="yes">Dans un deck</option>
        <option value="no">Hors deck</option>
      </select>
    </div>

    <div class="filter-group">
      <label>TRIER PAR</label>
      <select id="sortSelect" class="ctrl">
        <option value="name">Nom</option>
        <option value="price_asc">Prix ↑</option>
        <option value="price_desc">Prix ↓</option>
        <option value="qty_desc">Quantité ↓</option>
        <option value="qty_asc">Quantité ↑</option>
      </select>
    </div>

    <div class="stats-bar" id="statsBar">—</div>
    <button id="clearCollectionBtn" onclick="clearCollection()" style="
      font-family:var(--serif-engraved);font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;
      padding:6px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;
      border:1px solid rgba(220,80,80,0.4);color:#e07b7b;background:rgba(220,80,80,0.08);
      transition:background .2s,border-color .2s;
    ">Vider la collection</button>
  </div>

  <div class="table-wrap">
    <table id="collTable">
      <thead>
        <tr>
          <th>Carte</th>
          <th>Type / Coût</th>
          <th class="qty-cell">Qté</th>
          <th style="text-align:right">Prix unit.</th>
          <th style="text-align:right">Valeur</th>
          <th>Decks</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" class="state-msg"><div class="spinner"></div><br>Chargement…</td></tr>
      </tbody>
    </table>
  </div>

</div>
<div id="toast"></div>

<script src="/auth-guard.js"></script>
<script>
(() => {
  const searchInput = document.getElementById('searchInput');
  const clearBtn    = document.getElementById('clearBtn');
  const deckFilter  = document.getElementById('deckFilter');
  const sortSelect  = document.getElementById('sortSelect');
  const tableBody   = document.getElementById('tableBody');
  const statsBar    = document.getElementById('statsBar');

  // State
  let allCards = [];       // données brutes serveur
  let prices   = {};       // { scryfall_id: price_eur }
  let pricesFetched = new Set();
  let searchTimeout = null;

  // ── Fetch collection ──────────────────────────────────────────
  async function loadCollection() {
    const search  = searchInput.value.trim();
    const inDeck  = deckFilter.value;
    const params  = new URLSearchParams({ search, in_deck: inDeck });

    tableBody.innerHTML = '<tr><td colspan="7" class="state-msg"><div class="spinner"></div><br>Chargement…</td></tr>';

    try {
      const res  = await fetch(`/api/collection?${params}`);
      const data = await res.json();
      allCards = data.cards || [];
      renderTable();
      fetchPrices();
    } catch (e) {
      tableBody.innerHTML = '<tr><td colspan="7" class="state-msg">Erreur de chargement.</td></tr>';
    }
  }

  // ── Prix Scryfall (batch) ─────────────────────────────────────
  async function fetchPrices() {
    const ids = allCards
      .filter(c => c.scryfall_id && !pricesFetched.has(c.scryfall_id))
      .map(c => c.scryfall_id);

    if (ids.length === 0) return;

    // Scryfall collection endpoint: POST /cards/collection (max 75 per request)
    const CHUNK = 75;
    for (let i = 0; i < ids.length; i += CHUNK) {
      const chunk = ids.slice(i, i + CHUNK);
      chunk.forEach(id => pricesFetched.add(id));
      try {
        const res  = await fetch('https://api.scryfall.com/cards/collection', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifiers: chunk.map(id => ({ id })) }),
        });
        const data = await res.json();
        (data.data || []).forEach(card => {
          const eur = card.prices && card.prices.eur ? parseFloat(card.prices.eur) : null;
          if (card.id) prices[card.id] = eur;
        });
        renderTable(); // Re-render avec les prix disponibles
      } catch (_) {}
    }
  }

  // ── Rendu table ───────────────────────────────────────────────
  function renderTable() {
    const sort = sortSelect.value;
    let cards  = [...allCards];

    // Tri
    if (sort === 'name') {
      cards.sort((a, b) => a.card_name.localeCompare(b.card_name, 'fr'));
    } else if (sort === 'price_asc') {
      cards.sort((a, b) => (getPrice(a) ?? Infinity) - (getPrice(b) ?? Infinity));
    } else if (sort === 'price_desc') {
      cards.sort((a, b) => (getPrice(b) ?? -1) - (getPrice(a) ?? -1));
    } else if (sort === 'qty_desc') {
      cards.sort((a, b) => b.quantity - a.quantity);
    } else if (sort === 'qty_asc') {
      cards.sort((a, b) => a.quantity - b.quantity);
    }

    if (cards.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="7" class="state-msg">Aucune carte trouvée.</td></tr>';
      statsBar.innerHTML  = '0 carte';
      return;
    }

    // Calcul valeur totale
    let totalVal = 0;
    let priceKnown = 0;
    cards.forEach(c => {
      const p = getPrice(c);
      if (p !== null) { totalVal += p * c.quantity; priceKnown++; }
    });

    const totalStr = priceKnown > 0
      ? ` · <strong>${totalVal.toFixed(2)} €</strong>`
      : '';
    statsBar.innerHTML = `<strong>${cards.length}</strong> carte${cards.length > 1 ? 's' : ''} · <strong>${cards.reduce((s,c)=>s+c.quantity,0)}</strong> exemplaires${totalStr}`;

    tableBody.innerHTML = cards.map(card => buildRow(card)).join('');

    // Attacher les événements
    tableBody.querySelectorAll('.qty-btn-minus').forEach(btn => {
      btn.addEventListener('click', () => updateQty(btn.dataset.name, -1));
    });
    tableBody.querySelectorAll('.qty-btn-plus').forEach(btn => {
      btn.addEventListener('click', () => updateQty(btn.dataset.name, +1));
    });
    tableBody.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteCard(btn.dataset.name));
    });
  }

  function getPrice(card) {
    if (!card.scryfall_id) return null;
    const p = prices[card.scryfall_id];
    return (p !== undefined && p !== null) ? p : null;
  }

  function buildRow(card) {
    const price = getPrice(card);
    const priceStr  = price !== null
      ? `<div class="price-val">${price.toFixed(2)} €</div>`
      : `<div class="price-loading">…</div>`;
    const totalStr  = price !== null
      ? `<div class="price-total">${(price * card.quantity).toFixed(2)} €</div>`
      : '';

    const decksHtml = card.in_decks && card.in_decks.length > 0
      ? card.in_decks.map(d => `<span class="deck-tag">${escHtml(d)}</span>`).join('')
      : '<span class="no-deck">—</span>';

    const manaCost = card.mana_cost
      ? card.mana_cost.replace(/{/g,'').replace(/}/g,' ').trim()
      : '';

    const nameEsc = escHtml(card.card_name);
    const nameAttr = escAttr(card.card_name);

    return `
      <tr>
        <td class="card-name-cell">
          ${nameEsc}
        </td>
        <td>
          <div class="mana-cost">${escHtml(manaCost)}</div>
          <div class="card-type">${escHtml(card.type_line || '')}</div>
        </td>
        <td class="qty-cell">
          <div class="qty-control">
            <button class="qty-btn qty-btn-minus" data-name="${nameAttr}" title="Retirer un exemplaire">−</button>
            <span class="qty-val">${card.quantity}</span>
            <button class="qty-btn qty-btn-plus" data-name="${nameAttr}" title="Ajouter un exemplaire">+</button>
          </div>
        </td>
        <td class="price-cell">${priceStr}</td>
        <td class="price-cell">${totalStr}</td>
        <td class="deck-cell">${decksHtml}</td>
        <td class="action-cell">
          <button class="del-btn" data-name="${nameAttr}" title="Retirer de la collection">Suppr.</button>
        </td>
      </tr>`;
  }

  // ── Mise à jour quantité ──────────────────────────────────────
  async function updateQty(cardName, delta) {
    const card = allCards.find(c => c.card_name === cardName);
    if (!card) return;

    const newQty = card.quantity + delta;
    if (newQty <= 0) {
      if (!confirm(`Supprimer "${cardName}" de la collection ?`)) return;
    }

    try {
      await fetch(`/api/collection/${encodeURIComponent(cardName)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantity: newQty }),
      });
      if (newQty <= 0) {
        allCards = allCards.filter(c => c.card_name !== cardName);
      } else {
        card.quantity = newQty;
      }
      renderTable();
      showToast(newQty <= 0 ? `${cardName} retiré` : `${cardName} : ${newQty}×`);
    } catch (e) {
      showToast('Erreur lors de la mise à jour.', true);
    }
  }

  // ── Suppression ───────────────────────────────────────────────
  async function deleteCard(cardName) {
    if (!confirm(`Supprimer "${cardName}" de la collection ?`)) return;
    try {
      await fetch(`/api/collection/${encodeURIComponent(cardName)}`, { method: 'DELETE' });
      allCards = allCards.filter(c => c.card_name !== cardName);
      renderTable();
      showToast(`${cardName} supprimé`);
    } catch (e) {
      showToast('Erreur lors de la suppression.', true);
    }
  }

  // ── Vider la collection ───────────────────────────────────────
  async function clearCollection() {
    if (!confirm(`Vider entièrement votre collection ? Cette action est irréversible.`)) return;
    try {
      await fetch('/api/collection', { method: 'DELETE' });
      allCards = [];
      renderTable();
      showToast('Collection vidée.');
    } catch (e) {
      showToast('Erreur lors de la suppression.', true);
    }
  }

  // ── Utilitaires ───────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg, isErr = false) {
    const t = document.getElementById('toast');
    t.textContent  = msg;
    t.style.borderColor = isErr ? 'rgba(220,60,60,0.5)' : 'var(--gold-line)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── Listeners ─────────────────────────────────────────────────
  searchInput.addEventListener('input', () => {
    clearBtn.style.display = searchInput.value ? 'flex' : 'none';
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(loadCollection, 350);
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    loadCollection();
  });
  deckFilter.addEventListener('change', loadCollection);
  sortSelect.addEventListener('change', renderTable);

  // Init
  loadCollection();
})();
</script>
</body>
</html>
