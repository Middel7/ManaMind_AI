<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Alléger un deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .trim-card { position: relative; }
  .trim-card__rate {
    position: absolute; top: 6px; left: 6px;
    padding: 2px 7px; border-radius: var(--r-sm);
    background: var(--overlay); border: 1px solid rgba(229,105,94,.4);
    color: var(--danger);
    font-size: var(--text-xs); font-weight: 600;
    backdrop-filter: blur(4px);
  }
  .trim-card.is-removed { opacity: 0.4; }
  .trim-card.is-removed .mtg-card__frame { border-color: var(--danger); }
</style>
</head>
<body>

<div id="page">
  <div class="stack-2">
    <h2 class="h2">Quelles cartes retirer ?</h2>
    <p class="muted small">
      Ces cartes de votre deck sont les moins jouées par les autres decks du même
      commandant. Ce sont des candidates au retrait, pas une vérité : vos choix
      personnels priment.
    </p>
  </div>

  <div class="toolbar">
    <div id="deckPicker" class="grow"></div>
  </div>

  <div id="results"></div>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const user = await MM.boot({ title: 'Alléger un deck', nav: 'decks' });
  if (!user) return;

  const results = MM.el('#results');
  let currentDeck = null;
  let cards = [];
  let resolved = {};

  await MM.deckPicker(MM.el('#deckPicker'), (deck) => {
    currentDeck = deck;
    load();
  }, { label: 'Deck à alléger' });

  async function load() {
    if (!currentDeck) return;
    results.innerHTML = `<div class="card-grid">${MM.cardSkeletons(12)}</div>`;
    try {
      const data = await MM.api.get(
        `/api/deck-trim?commander=${encodeURIComponent(currentDeck.commander)}`);
      cards = data.results || [];
      resolved = await MM.resolveCards(cards.map((card) => card.card_name));
      render(data);
    } catch (err) {
      results.innerHTML = MM.empty({
        icon: 'warning', title: 'Analyse impossible', text: err.message });
    }
  }

  function render(data) {
    if (!cards.length) {
      results.innerHTML = MM.empty({
        icon: 'check',
        title: 'Rien à retirer',
        text: 'Toutes les cartes de ce deck sont couramment jouées avec ce commandant.',
      });
      return;
    }

    const total = cards[0].total_decks || 0;
    results.innerHTML = `
      <div class="panel panel--accent" style="margin-bottom:var(--sp-5)">
        <div class="panel__body cluster">
          <span class="grow small">
            Analyse fondée sur <strong>${MM.fmt.int(total)} decks</strong> jouant
            ${MM.esc(currentDeck.commander)}.
          </span>
        </div>
      </div>
      <div class="card-grid" id="grid"></div>`;

    MM.el('#grid').innerHTML = cards.map((card, index) => {
      const info = resolved[card.card_name] || {};
      return `
        <article class="mtg-card trim-card" data-index="${index}">
          <div class="mtg-card__frame">
            ${MM.img.frame({ card_name: card.card_name, ...info })}
            <span class="trim-card__rate">${card.inclusion_rate.toFixed(1)} %</span>
          </div>
          <div class="mtg-card__foot">
            <span class="mtg-card__name" title="${MM.esc(card.card_name)}">
              ${MM.esc(card.card_name)}</span>
            <span class="mtg-card__meta">
              <span class="dim">${MM.fmt.int(card.decks_with_card)} decks sur
                ${MM.fmt.int(card.total_decks)}</span>
              ${info.unit_price != null
                ? `<span class="mtg-card__price">${MM.fmt.eur(info.unit_price)}</span>` : ''}
            </span>
            <button class="btn btn--sm btn--danger" data-remove="${index}"
                    style="margin-top:6px">Retirer du deck</button>
          </div>
        </article>`;
    }).join('');
  }

  results.addEventListener('click', async (event) => {
    const button = event.target.closest('[data-remove]');
    if (!button) return;
    const card = cards[Number(button.dataset.remove)];
    const ok = await MM.confirm({
      title: 'Retirer cette carte ?',
      text: `« ${card.card_name} » sera retirée de ${currentDeck.name}. `
        + "Votre collection n'est pas modifiée.",
      confirmLabel: 'Retirer', danger: true,
    });
    if (!ok) return;

    button.disabled = true;
    try {
      await MM.api.post('/api/deck-card/remove', {
        deck_id: currentDeck.deck_id,
        commander: currentDeck.commander,
        card_name: card.card_name,
      });
      button.closest('.trim-card').classList.add('is-removed');
      button.textContent = 'Retirée ✓';
      MM.toast('Carte retirée du deck.');
    } catch (err) {
      MM.toast.error(err.message);
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
