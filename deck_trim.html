<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Alléger un deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
</style>
</head>
<body>

<div id="page">
  <div class="stack-2">
    <h2 class="h2">Quelles cartes retirer ?</h2>
    <p class="muted small">
      Ces cartes de votre deck sont les moins jouées par les autres decks du même
      commandant. Ce sont des candidates au retrait, pas une vérité : vos choix
      personnels priment.
    </p>
  </div>

  <div class="toolbar">
    <div id="deckPicker" class="grow"></div>
  </div>

  <div id="results"></div>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const user = await MM.boot({ title: 'Alléger un deck', nav: 'decks' });
  if (!user) return;

  const results = MM.el('#results');
  let currentDeck = null;
  let cards = [];
  let resolved = {};

  await MM.deckPicker(MM.el('#deckPicker'), (deck) => {
    currentDeck = deck;
    MM.deckContext = deck;   // cible des reglages « dans le deck »
    load();
  }, { label: 'Deck à alléger' });

  async function load() {
    if (!currentDeck) return;
    results.innerHTML = `<div class="card-grid">${MM.cardSkeletons(12)}</div>`;
    try {
      const data = await MM.api.get(
        `/api/deck-trim?commander=${encodeURIComponent(currentDeck.commander)}`);
      cards = data.results || [];
      resolved = await MM.resolveCards(cards.map((card) => card.card_name));
      render(data);
    } catch (err) {
      results.innerHTML = MM.empty({
        icon: 'warning', title: 'Analyse impossible', text: err.message });
    }
  }

  function render(data) {
    if (!cards.length) {
      results.innerHTML = MM.empty({
        icon: 'check',
        title: 'Rien à retirer',
        text: 'Toutes les cartes de ce deck sont couramment jouées avec ce commandant.',
      });
      return;
    }

    const total = cards[0].total_decks || 0;
    results.innerHTML = `
      <div class="panel panel--accent" style="margin-bottom:var(--sp-5)">
        <div class="panel__body cluster">
          <span class="grow small">
            Analyse fondée sur <strong>${MM.fmt.int(total)} decks</strong> jouant
            ${MM.esc(currentDeck.commander)}.
          </span>
        </div>
      </div>
      <div class="card-grid" id="grid"></div>`;

    MM.el('#grid').innerHTML = cards.map((card) => MM.cardTile({
      ...(resolved[card.card_name] || {}),
      card_name: card.card_name,
    }, {
      context: 'deck',
      deckQty: card.quantity ?? 1,
      note: `${card.inclusion_rate.toFixed(1)} % · ${MM.fmt.int(card.decks_with_card)}`
        + ` decks sur ${MM.fmt.int(card.total_decks)}`,
    })).join('');
  }

  // Retirer par le reglage suffit : la carte quitte la liste des candidates.
  document.addEventListener('mm:card-change', (event) => {
    if (event.detail.scope !== 'deck' || event.detail.delta > 0) return;
    MM.toast(`${event.detail.card_name} retirée de ${currentDeck.name}.`);
    load();
  });
})();
</script>
</body>
</html>
