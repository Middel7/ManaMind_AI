<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Alléger un deck</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08080C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ManaMind">
<link rel="icon" href="/static/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
</style>
</head>
<body>

<div id="page">
  <div class="stack-2">
    <h2 class="h2">Quelles cartes retirer ?</h2>
    <p class="muted small">
      Votre liste est comparée à celles des autres joueurs du même commandant : les
      cartes que presque personne ne reprend arrivent en tête. Ce sont des candidates
      au retrait, pas un verdict — vos choix personnels priment.
    </p>
  </div>

  <div class="toolbar">
    <div id="deckPicker" class="grow"></div>
  </div>

  <div id="results"></div>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const user = await MM.boot({ title: 'Alléger un deck', nav: 'decks' });
  if (!user) return;

  const results = MM.el('#results');
  let currentDeck = null;
  let cards = [];
  let resolved = {};

  await MM.deckPicker(MM.el('#deckPicker'), (deck) => {
    currentDeck = deck;
    MM.deckContext = deck;   // cible des reglages « dans le deck »
    load();
  }, { label: 'Deck à alléger' });

  async function load() {
    if (!currentDeck) return;
    results.innerHTML = `<div class="card-grid">${MM.cardSkeletons(12)}</div>`;
    try {
      const data = await MM.api.get(
        `/api/deck-trim?commander=${encodeURIComponent(currentDeck.commander)}`);
      cards = data.results || [];
      resolved = await MM.resolveCards(cards.map((card) => card.card_name));
      render(data);
    } catch (err) {
      results.innerHTML = MM.empty({
        icon: 'warning', title: 'Analyse impossible', text: err.message });
    }
  }

  function render(data) {
    if (!cards.length) {
      results.innerHTML = MM.empty({
        icon: 'check',
        title: 'Rien à retirer',
        text: 'Toutes les cartes de ce deck sont couramment jouées avec ce commandant.',
      });
      return;
    }

    const total = cards[0].total_decks || 0;
    // Le bandeau disait sur combien de decks portait l'analyse, sans dire ce
    // qu'on en tire ni comment lire les chiffres des vignettes.
    results.innerHTML = `
      <div class="panel" style="margin-bottom:var(--sp-4)">
        <div class="panel__body" style="display:flex;flex-direction:column;
                                        gap:var(--sp-4)">
          <div class="cluster">
            <span class="accent">${MM.icons.chart}</span>
            <span class="grow small">
              Analyse fondée sur <strong>${MM.fmt.int(total)} decks</strong> jouant
              ${MM.esc(currentDeck.commander)}.
              <span class="muted">Les ${MM.fmt.int(cards.length)} cartes ci-dessous
              sont celles que ces decks reprennent le moins, de la plus rare à la
              plus courante.</span>
            </span>
          </div>
          <p class="note"><b>Comment lire.</b> Une carte rare dans les autres decks
            n'est pas une mauvaise carte : c'est souvent ce qui rend une liste
            personnelle. Retirez d'abord celles que vous ne posez presque jamais en
            partie, ou dont l'effet fait double emploi.</p>
        </div>
      </div>
      ${MM.legend([
        { icon: 'chart', strong: 'x % · n decks sur N :',
          text: 'la part des listes du même commandant qui jouent cette carte.' },
        { icon: 'minus', strong: 'Le réglage :',
          text: 'retire la carte du deck ; elle reste dans votre collection.' },
        { icon: 'coin', strong: 'Le prix :',
          text: 'valeur estimée de l’exemplaire, utile pour arbitrer un retrait.' },
      ])}
      <div class="card-grid" id="grid" style="margin-top:var(--sp-4)"></div>`;

    MM.el('#grid').innerHTML = cards.map((card) => MM.cardTile({
      ...(resolved[card.card_name] || {}),
      card_name: card.card_name,
    }, {
      context: 'deck',
      deckQty: card.quantity ?? 1,
      note: `${MM.fmt.pct(card.inclusion_rate)} · ${MM.fmt.int(card.decks_with_card)}`
        + ` decks sur ${MM.fmt.int(card.total_decks)}`,
    })).join('');
  }

  // Retirer par le reglage suffit : la carte quitte la liste des candidates.
  document.addEventListener('mm:card-change', (event) => {
    if (event.detail.scope !== 'deck' || event.detail.delta > 0) return;
    MM.toast(`${event.detail.card_name} retirée de ${currentDeck.name}.`);
    load();
  });
})();
</script>
</body>
</html>
