<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Analyse du deck</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08080C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ManaMind">
<link rel="icon" href="/static/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  /* Le titre mene au deck analyse, comme sur les resultats : il garde
     l'allure d'un titre et ne se revele lien qu'au survol. */
  .deep-hero__link {
    color: inherit;
    text-decoration: none;
    transition: color var(--dur-fast) var(--ease);
  }
  .deep-hero__link:hover { color: var(--accent); }
</style>
</head>
<body>

<div id="page">
  <section class="hero" id="hero">
    <div class="hero__body">
      <div class="skeleton skeleton--text" style="width:280px;height:32px"></div>
    </div>
  </section>
  <div id="content">
    <div class="center" style="padding:80px"><span class="spinner spinner--lg"></span></div>
  </div>
</div>

<script src="/static/js/mm.js"></script>
<script src="/static/js/deep.js"></script>
<script>
/* Page autonome de l'analyse poussee, pour les liens deja partages : depuis
   les resultats d'analyse, elle s'ouvre desormais dans leur troisieme onglet.
   Le rendu vient de deep.js, commun aux deux. */
(async () => {
  const user = await MM.boot({ title: 'Analyse du deck', nav: 'analyze' });
  if (!user) return;

  const deckId = new URLSearchParams(location.search).get('deck');
  const content = MM.el('#content');

  // Le bandeau reprend l'illustration de la derniere analyse quand elle porte
  // sur ce deck : l'API des categories ne la connait pas.
  let deckInfo = {};
  try { deckInfo = JSON.parse(sessionStorage.getItem('mm_analysis_deck')) || {}; } catch {}
  if (deckInfo.deck_id !== deckId) deckInfo = {};

  // Les resultats d'ou l'on vient, s'ils portent sur ce deck : le retour y
  // ramene. Sans eux, pas de bouton — les resultats ne survivent pas a la
  // session.
  let backUrl = null;
  try { backUrl = sessionStorage.getItem('mm_analysis_url'); } catch {}
  if (!deckInfo.deck_id || !backUrl || !backUrl.startsWith('/analyse?')) backUrl = null;

  function renderHero(deck, stats) {
    const art = deckInfo.scryfall_id ? MM.scryfallArt(deckInfo.scryfall_id) : null;
    const eyebrow = MM.deckEyebrow(deck.commander, deck.name) || 'Analyse';
    MM.el('#hero').innerHTML = `
      ${art ? `<div class="hero__art" style="background-image:url('${MM.esc(art)}')"></div>` : ''}
      <div class="hero__body">
        <p class="eyebrow">${MM.esc(eyebrow)}</p>
        <h2 class="hero__title">
          <a class="deep-hero__link" href="/decks/${encodeURIComponent(deck.deck_id)}"
             title="Ouvrir le deck">${MM.esc(deck.name || 'Deck')}</a></h2>
        <p class="muted">Ce que fait votre deck, catégorie par catégorie, face aux
          decks du même commandant.</p>
        ${stats || ''}
        <div class="hero__actions">
          ${backUrl ? `<a class="btn btn--sm btn--primary" href="${MM.esc(backUrl)}">
            Retour aux résultats</a>` : ''}
          <a class="btn btn--sm" href="/decks/${encodeURIComponent(deck.deck_id)}">
            Ouvrir le deck</a>
          <a class="btn btn--sm btn--ghost" href="/decks/analyse">Nouvelle analyse</a>
        </div>
      </div>`;
  }

  if (!deckId) {
    MM.el('#hero').hidden = true;
    content.innerHTML = MM.empty({
      icon: 'warning',
      title: 'Aucun deck à analyser',
      text: 'Cette page s’ouvre depuis les résultats d’une analyse de deck.',
      action: { href: '/decks/analyse', label: 'Analyser un deck' },
    });
    return;
  }

  await MM.deepAnalysis(content, {
    deckId,
    commander: deckInfo.commander || null,
    onData: (data) => renderHero(data.deck, `
      <div class="hero__stats">
        <span class="hero__stat"><b>${MM.fmt.int(data.decks)}</b>
          <span class="muted small">${data.decks > 1 ? 'decks similaires' : 'deck similaire'}</span></span>
        <span class="hero__stat"><b>${MM.fmt.int(data.deck_cards)}</b>
          <span class="muted small">cartes analysées, hors terrains de base</span></span>
      </div>`),
  });
})();
</script>
</body>
</html>
