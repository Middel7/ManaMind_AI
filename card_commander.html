<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Commandant pour une carte</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08080C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ManaMind">
<link rel="icon" href="/static/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .search-hero { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: var(--sp-6); align-items: start; }
  @media (max-width: 720px) {
    /* « 1fr » garde un minimum egal a la largeur de son contenu : la liste des
       commandants etirait la colonne a 393 px pour 380 px disponibles, et la
       page entiere partait en defilement lateral. Le minmax(0, …) la borne. */
    .search-hero { grid-template-columns: minmax(0, 1fr); }
    /* La vignette ne prend plus toute la largeur : pleine page, elle repoussait
       la liste des commandants sous la ligne de flottaison, et son bord droit
       touchait l'ecran quand le gauche gardait sa marge. */
    .search-hero > .mtg-card { width: min(240px, 100%); margin-inline: auto; }
  }

  .cmd-row {
    display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-3) var(--sp-4);
    border-radius: var(--r-lg);
    border: 1px solid var(--line);
    background: var(--bg-raised);
    transition: border-color var(--dur) var(--ease);
  }
  /* Seules les lignes menant a un deck reagissent au survol : un liseret qui
     s'allume sur une ligne inerte promet un clic qui n'arrive jamais. */
  a.cmd-row:hover { border-color: var(--line-accent); }
  a.cmd-row:hover .cmd-row__go { opacity: 1; }
  /* La fleche ne se montre qu'au survol : affichee en permanence, elle
     alourdissait une liste ou la donnee compte plus que l'action. */
  .cmd-row__go { opacity: 0; flex-shrink: 0; color: var(--accent);
    transition: opacity var(--dur) var(--ease); }
  /* Au clavier, la ligne se signale comme au survol. */
  a.cmd-row:focus-visible .cmd-row__go { opacity: 1; }
  /* Sans survol, une fleche qui ne parait jamais ne dit plus rien : sur
     telephone, rien ne distinguait une ligne qui mene a un deck d'une ligne
     inerte. Elle s'affiche alors d'emblee, en retrait. */
  @media (hover: none) {
    a.cmd-row .cmd-row__go { opacity: 0.55; }
  }
  .cmd-row__thumb { width: 48px; aspect-ratio: var(--card-ratio); object-fit: cover;
    border-radius: 4px; background: var(--surface-2); flex-shrink: 0; }
  /* La miniature ouvre la carte en grand. A 48 px on ne lit ni le texte ni le
     cout de mana du commandant : c'etait la seule facon de le regarder
     vraiment, et rien ne disait qu'elle etait cliquable. */
  .cmd-row__thumb[data-zoom] { cursor: zoom-in; transition: outline-color var(--dur) var(--ease); outline: 2px solid transparent; }
  .cmd-row__thumb[data-zoom]:hover,
  .cmd-row__thumb[data-zoom]:focus-visible { outline-color: var(--accent); }
  .cmd-row__bar { width: 120px; flex-shrink: 0; }
  @media (max-width: 720px) { .cmd-row__bar { display: none; } }
</style>
</head>
<body>

<div id="page">
  <div class="stack-2">
    <h2 class="h2">Dans quel commandant jouer cette carte ?</h2>
    <p class="muted small">
      Saisissez une carte : nous cherchons les commandants dont les decks l'incluent
      le plus souvent.
    </p>
  </div>

  <div class="toolbar">
    <div class="search toolbar__search autocomplete" style="max-width:460px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input class="input" id="cardInput" type="text" autocomplete="off"
             placeholder="Nom de la carte…" enterkeyhint="search">
    </div>
    <div class="btn-group" role="group" aria-label="Périmètre">
      <button class="btn btn--sm" data-mode="mine" aria-pressed="true">Mes commandants</button>
      <button class="btn btn--sm" data-mode="all" aria-pressed="false">Tous</button>
    </div>
    <label class="switch" id="significantWrap" style="display:none">
      <input type="checkbox" id="significant" checked>
      <span class="switch__track"></span>
      <span class="small">Écarter les résultats peu significatifs</span>
    </label>
  </div>

  <div id="results">
    <div class="empty">
      <span class="empty__mark" id="emptyIcon"></span>
      <div class="stack-2" style="align-items:center">
        <p class="empty__title">Choisissez une carte</p>
        <p class="empty__text">Vous saurez quels commandants en tirent le meilleur parti.</p>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const user = await MM.boot({ title: 'Trouver un commandant pour une carte', nav: 'card' });
  if (!user) return;

  MM.el('#emptyIcon').innerHTML = MM.icons.crown;

  const results = MM.el('#results');
  const state = { card: null, mode: 'mine', significant: true };

  // Au moins 8 decks : en deçà, un taux de 100 % ne veut rien dire.
  const MIN_DECKS = 8;

  /** Vos decks, indexés par nom de commandant, pour rendre une suggestion
   *  cliquable. Chargés une fois : la liste ne bouge pas pendant la visite. */
  const decksByCommander = new Map();

  /** Clé de comparaison d'un nom de commandant : sans casse, et repli sur la
   *  face avant, un commandant recto-verso s'écrivant « A // B » ici et « A »
   *  là selon le deckbuilder d'origine. Même règle que MM.isCommander. */
  function commanderKey(name) {
    return String(name || '').trim().toLowerCase();
  }

  function frontFace(key) {
    return key.split(' // ')[0].trim();
  }

  async function loadDecks() {
    try {
      const data = await MM.api.get('/api/v2/decks');
      (data.decks || []).forEach((deck) => {
        const key = commanderKey(deck.commander);
        if (!key) return;
        // Les deux écritures pointent vers le même deck : on indexe les deux
        // plutôt que de normaliser à la lecture, plus court et plus sûr.
        decksByCommander.set(key, deck.deck_id);
        if (!decksByCommander.has(frontFace(key))) {
          decksByCommander.set(frontFace(key), deck.deck_id);
        }
      });
    } catch {
      // Sans la liste, les lignes restent inertes : la page garde son sens.
    }
  }

  // Lancé sans être attendu : la liste ne sert qu'au rendu des suggestions,
  // elle n'a pas à retarder le premier affichage de la page.
  const decksReady = loadDecks();

  /** L'identifiant du deck où vous jouez ce commandant, ou null. */
  function deckFor(commander) {
    const key = commanderKey(commander);
    return decksByCommander.get(key) || decksByCommander.get(frontFace(key)) || null;
  }

  /** Le prix de la carte cherchée. L'autocomplétion ne le renvoie pas : on le
   *  résout par le même chemin que le reste du projet — la plus petite cote
   *  de la carte, toutes éditions confondues. */
  async function ensurePrice() {
    if (!state.card || state.card.unit_price !== undefined) return;
    try {
      const resolved = await MM.resolveCards([state.card.name]);
      const info = resolved[state.card.name];
      state.card.unit_price = info ? (info.unit_price ?? null) : null;
    } catch {
      // Le prix est un complément : son absence n'empêche pas d'afficher la carte.
      state.card.unit_price = null;
    }
  }

  MM.autocomplete(MM.el('#cardInput'), (card) => {
    MM.el('#cardInput').value = card.name;
    state.card = card;
    load();
  });

  MM.els('[data-mode]').forEach((button) => {
    button.addEventListener('click', () => {
      state.mode = button.dataset.mode;
      MM.els('[data-mode]').forEach((other) =>
        other.setAttribute('aria-pressed', String(other === button)));
      MM.el('#significantWrap').style.display = state.mode === 'all' ? 'inline-flex' : 'none';
      load();
    });
  });

  MM.el('#significant').addEventListener('change', (event) => {
    state.significant = event.target.checked;
    load();
  });

  async function load() {
    if (!state.card) return;
    results.innerHTML = `<div class="stack-2">${Array.from({ length: 6 }, () =>
      '<div class="skeleton" style="height:74px"></div>').join('')}</div>`;

    try {
      // Les trois chargements sont indépendants : le prix de la carte et la
      // liste de vos decks n'ont pas à attendre la suggestion, ni l'inverse.
      const [data] = await Promise.all([
        MM.api.get('/api/commander-suggest' + MM.api.qs({
          card: state.card.name, top: 10, mode: state.mode,
        })),
        ensurePrice(),
        decksReady,
      ]);
      render(data.suggestions || []);
    } catch (err) {
      results.innerHTML = MM.empty({
        icon: 'warning', title: 'Recherche impossible', text: err.message });
    }
  }

  function render(all) {
    const filtered = (state.mode === 'all' && state.significant)
      ? all.filter((entry) => entry.total_decks >= MIN_DECKS)
      : all;
    const hidden = all.length - filtered.length;

    if (!filtered.length) {
      results.innerHTML = `
        <div class="search-hero">
          ${cardTile()}
          <div>${MM.empty({
            icon: 'crown',
            title: 'Aucun commandant trouvé',
            text: state.mode === 'mine'
              ? `Aucun de vos commandants ne joue « ${state.card.name} ». `
                + 'Essayez avec « Tous » pour élargir la recherche.'
              : `Aucune donnée exploitable pour « ${state.card.name} ».`,
          })}</div>
        </div>`;
      return;
    }

    const best = Math.max(...filtered.map((entry) => entry.inclusion_rate)) || 1;
    const image = MM.img.card(state.card);

    results.innerHTML = `
      <div class="search-hero">
        ${cardTile()}

        <div class="stack-2">
          ${MM.legend([
            { icon: 'chart', strong: 'Le pourcentage :',
              text: 'part des decks de ce commandant qui jouent la carte.' },
            { icon: 'layers', strong: 'La barre :',
              text: 'situe chaque commandant par rapport au mieux classé de la liste.' },
            { icon: 'eye', strong: 'Le périmètre :',
              text: '« Mes commandants » se limite à vos decks, « Tous » ouvre à l’ensemble des commandants connus.' },
          ])}
          ${hidden ? `<p class="xs dim">${hidden} résultat${hidden > 1 ? 's' : ''}
            écarté${hidden > 1 ? 's' : ''} faute de decks suffisants
            (moins de ${MIN_DECKS}).</p>` : ''}
          ${filtered.map((entry) => {
            // La suggestion ne porte qu'un nom de commandant. La ligne ne
            // devient un lien que si ce commandant correspond a l'un de vos
            // decks : sans deck, la page d'analyse n'aurait rien a analyser.
            const deckId = deckFor(entry.commander);
            const balise = deckId ? 'a' : 'article';
            const lien = deckId
              ? ` href="/decks/analyse?deck=${encodeURIComponent(deckId)}"
                  title="Analyser votre deck ${MM.esc(entry.commander)}"`
              : ' title="Vous ne jouez pas ce commandant : aucun deck à analyser"';
            return `
            <${balise} class="cmd-row"${lien}>
              ${entry.image_url
                ? `<img class="cmd-row__thumb" src="${MM.esc(entry.image_url)}"
                     alt="" loading="lazy" data-zoom="${MM.esc(entry.commander)}"
                     role="button" tabindex="0"
                     title="Voir ${MM.esc(entry.commander)} en grand">`
                : '<span class="cmd-row__thumb"></span>'}
              <div class="grow" style="min-width:0">
                <p class="strong truncate">${MM.esc(entry.commander)}
                  ${entry.in_my_decks
                    ? '<span class="badge badge--info">dans vos decks</span>' : ''}</p>
                <p class="xs dim">${MM.fmt.int(entry.decks_with_card)} decks sur
                  ${MM.fmt.int(entry.total_decks)} l'incluent</p>
              </div>
              <div class="cmd-row__bar">
                <div class="progress">
                  <div class="progress__bar"
                       style="width:${(entry.inclusion_rate / best) * 100}%"></div>
                </div>
              </div>
              <span class="strong num" style="width:64px;text-align:right">
                ${MM.fmt.pct(entry.inclusion_rate)}</span>
              ${deckId ? `<span class="cmd-row__go">${MM.icons.chevron}</span>` : ''}
            </${balise}>`;
          }).join('')}
        </div>
      </div>`;
  }

  /** Vignette de la carte cherchee : illustration, possession et actions.
   *  Elle s'affiche qu'un commandant ait ete trouve ou non — c'est la carte
   *  qui interesse l'utilisateur, pas seulement le resultat de l'analyse. */
  function cardTile() {
    return MM.cardTile(
      { ...state.card, card_name: state.card.name, owned: state.card.owned },
      {
        context: 'collection',
        // Le bouton « Dans quel commandant ? » ramenerait a cet ecran, pour
        // cette carte : c'est celui qu'on regarde.
        commander: false,
        actions: [
          { label: 'Regarder une autre carte', act: 'back', variant: 'ghost',
            title: 'Revenir à la liste des cartes qui dorment' },
        ],
      });
  }


  /** Ouvre la fiche d'un commandant : son illustration en grand, son texte et
   *  ce que vous en possedez. Le clic est intercepte avant la ligne, qui mene
   *  sinon a l'analyse du deck. */
  function zoom(cible) {
    MM.cardDetail(cible.dataset.zoom);
  }

  results.addEventListener('click', (event) => {
    const vignette = event.target.closest('[data-zoom]');
    if (vignette) {
      event.preventDefault();
      event.stopPropagation();
      zoom(vignette);
      return;
    }

    if (event.target.closest('[data-act="back"]')) {
      // Retour a l'ecran de depart : le champ se vide et l'URL oublie la carte,
      // pour qu'un rechargement ramene bien la liste et non le resultat.
      MM.el('#cardInput').value = '';
      state.card = null;
      history.replaceState(null, '', '/cartes/commandant');
      showDormant();
    }
  });

  // Au clavier, la miniature repond comme le bouton qu'elle annonce etre.
  results.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const vignette = event.target.closest('[data-zoom]');
    if (!vignette) return;
    event.preventDefault();
    zoom(vignette);
  });

  /** Ecran d'accueil : les cartes rares et mythiques qu'aucun deck n'utilise,
   *  les plus cheres d'abord. Un clic lance la recherche de commandant pour
   *  cette carte — c'est le point de depart naturel de cet ecran. */
  async function showDormant() {
    results.innerHTML = `<div class="stack-2">
      <h3 class="h3">Vos cartes qui dorment</h3>
      <div class="card-grid">${MM.cardSkeletons(8)}</div></div>`;
    try {
      const data = await MM.api.get('/api/v2/collection/dormant?limit=60');
      const items = data.items || [];
      if (!items.length) {
        results.innerHTML = MM.empty({
          icon: 'search', title: 'Cherchez une carte',
          text: 'Saisissez le nom d’une carte pour voir dans quels commandants elle est '
            + 'le plus jouée.' });
        return;
      }
      results.innerHTML = `
        <div class="stack-2">
          <div class="between">
            <h3 class="h3">Vos cartes qui dorment</h3>
            <span class="badge">${MM.fmt.int(items.length)}</span>
          </div>
          <p class="muted small">Rares et mythiques qu’aucun de vos decks n’utilise, de la
            plus chère à la moins chère. « Dans quel commandant ? », sous une carte,
            lance la recherche ; saisissez un autre nom ci-dessus pour en viser
            une qui n’est pas dans cette liste.</p>
          <div class="card-grid">
            ${items.map((item) => MM.cardTile(item, {
              context: 'collection',
            })).join('')}
          </div>
        </div>`;
    } catch (err) {
      results.innerHTML = MM.empty({
        icon: 'warning', title: 'Chargement impossible', text: err.message });
    }
  }

  // Permet d'arriver depuis un lien : /cartes/commandant?card=Sol+Ring
  const requested = new URLSearchParams(location.search).get('card');
  if (requested) {
    MM.el('#cardInput').value = requested;
    try {
      const data = await MM.api.get(
        `/api/v2/cards/suggest?q=${encodeURIComponent(requested)}&limit=1`);
      state.card = (data.cards && data.cards[0]) || { name: requested };
    } catch { state.card = { name: requested }; }
    load();
  } else {
    showDormant();
  }

  // Le champ ne prend le curseur qu'a la souris, et seulement si l'on arrive
  // les mains vides. Sur telephone, l'ancien `autofocus` levait le clavier
  // alors que « Dans quel commandant ? » venait deja de poser la carte et de
  // lancer la recherche : il ne restait plus qu'a refermer un clavier pour
  // lire un resultat qu'on n'avait pas demande a saisir.
  if (!requested && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    MM.el('#cardInput').focus();
  }
})();
</script>
</body>
</html>
