<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Decks à construire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .cmd-card {
    position: relative;
    display: flex; flex-direction: column;
    border-radius: var(--r-lg);
    border: 1px solid var(--line);
    background: var(--bg-raised);
    overflow: hidden;
    isolation: isolate;
    transition: border-color var(--dur) var(--ease);
  }
  .cmd-card:hover { border-color: var(--line-accent); }

  /* L'en-tete se limite a son texte : les 128 px qu'il reservait a l'art de
     fond profitent desormais a la carte elle-meme, sans grandir la tuile. */
  .cmd-card__head { position: relative; display: flex; align-items: flex-end; padding: var(--sp-3) var(--sp-4); }
  .cmd-card__art { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center 22%; opacity: 0.5; }
  .cmd-card__head::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(0deg, var(--bg-raised) 8%, rgba(14,14,21,0.35) 100%);
  }
  .cmd-card__body { padding: var(--sp-3) var(--sp-4) var(--sp-4);
                    display: flex; flex-direction: column; gap: var(--sp-3); }

  /* La carte du commandant, seule dans la tuile — deux exemplaires pour un duo.
     Hauteur commune : sans elle, un duo (deux cartes plus etroites, donc plus
     courtes) donnerait une tuile plus basse que celle d'un commandant seul. */
  .cmd-card__split {
    display: flex; gap: var(--sp-2);
    align-items: center; justify-content: center;
    height: 300px;
  }
  .cmd-card__portrait {
    max-width: 100%; max-height: 100%;
    width: auto;
    border-radius: 4.7% / 3.5%;
    box-shadow: var(--shadow-card);
  }
</style>
</head>
<body>

<div id="page">
  <div class="stack-2">
    <h2 class="h2">Quels decks pouvez-vous construire ?</h2>
    <p class="muted small">
      Ces commandants sont ceux qui tirent le plus de valeur des cartes que vous
      possédez déjà, d'après ce que jouent réellement les autres decks.
    </p>
  </div>

  <div class="toolbar">
    <div class="btn-group" role="group" aria-label="Périmètre">
      <button class="btn btn--sm" data-mode="available" aria-pressed="true">
        Cartes disponibles</button>
      <button class="btn btn--sm" data-mode="all" aria-pressed="false">
        Toute la collection</button>
    </div>
    <p class="xs dim" id="modeHint" style="flex:1">
      Seules les cartes qui ne sont dans aucun de vos decks sont prises en compte.
    </p>
  </div>

  <div id="results"></div>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  const user = await MM.boot({ title: 'Construire un deck avec mes cartes disponibles', nav: 'build' });
  if (!user) return;

  const results = MM.el('#results');
  let mode = 'available';

  MM.els('[data-mode]').forEach((button) => {
    button.addEventListener('click', () => {
      mode = button.dataset.mode;
      MM.els('[data-mode]').forEach((other) =>
        other.setAttribute('aria-pressed', String(other === button)));
      MM.el('#modeHint').textContent = mode === 'available'
        ? 'Seules les cartes qui ne sont dans aucun de vos decks sont prises en compte.'
        : 'Toutes vos cartes sont prises en compte, y compris celles déjà jouées.';
      load();
    });
  });

  async function load() {
    results.innerHTML = `<div class="grid-2">${Array.from({ length: 6 }, () =>
      '<div class="skeleton" style="height:230px"></div>').join('')}</div>`;

    try {
      const data = await MM.api.get(`/api/collection-commanders?top=24&mode=${mode}`);
      render(data.commanders || []);
    } catch (err) {
      results.innerHTML = MM.empty({
        icon: 'warning', title: 'Analyse impossible', text: err.message });
    }
  }

  function render(commanders) {
    if (!commanders.length) {
      results.innerHTML = MM.empty({
        icon: 'crown',
        title: 'Pas encore de suggestion',
        text: 'Importez votre collection pour découvrir quels commandants elle permet '
          + 'de construire.',
        action: { href: '/collection/import', label: 'Importer ma collection' },
      });
      return;
    }

    results.innerHTML = `<div class="grid-2">${commanders.map((entry) => {
      const art = entry.commander_image
        ? entry.commander_image.replace('/normal/', '/art_crop/') : null;
      return `
        <article class="cmd-card">
          <div class="cmd-card__head">
            ${art ? `<div class="cmd-card__art"
              style="background-image:url('${MM.esc(art)}')"></div>` : ''}
            <div>
              <p class="h3">${MM.esc(entry.commander)}</p>
              <p class="xs muted">${MM.fmt.int(entry.card_count)} de vos cartes ·
                ${MM.fmt.eur(entry.total_value, { compact: true })}</p>
            </div>
          </div>
          <div class="cmd-card__body">
            <div class="cmd-card__split">
              ${(entry.commander_images || []).map((url) => `
                <img class="cmd-card__portrait" src="${MM.esc(url)}"
                     alt="${MM.esc(entry.commander)}" loading="lazy">`).join('')}
            </div>
            <div class="cluster-2">
              <a class="btn btn--sm"
                 href="/collection/commandants/${encodeURIComponent(entry.commander)}">
                 Voir le détail</a>
            </div>
          </div>
        </article>`;
    }).join('')}</div>`;
  }

  load();
})();
</script>
</body>
</html>
