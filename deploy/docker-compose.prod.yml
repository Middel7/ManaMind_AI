services:
  db:
    # Aligné sur le poste de travail, qui produit les dumps publiés par
    # deploy/push_manamind_data.sh : un dump issu d'un pg_dump plus récent que
    # le serveur cible peut contenir des directives qu'il ne comprend pas.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-manamind}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-manamind}
    volumes:
      # PostgreSQL 18 attend le montage sur /var/lib/postgresql, et place ses
      # données dans un sous-dossier versionné. Monter /var/lib/postgresql/data
      # comme avant fait échouer le démarrage sur « unused mount/volume ».
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres-backup:/backup
    restart: unless-stopped
    ports:
      # Boucle locale du serveur uniquement : la base reste injoignable depuis
      # Internet (le pare-feu Hetzner ferme d'ailleurs 5432). Ce point d'entrée
      # sert aux transferts administratifs depuis le poste de travail, à travers
      # un tunnel SSH — voir deploy/push_manamind_data.sh.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-manamind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: manamind:latest
    environment:
      DATABASE_URL: postgresql://${DB_USER:-manamind}:${DB_PASSWORD}@db:5432/${DB_NAME:-manamind}
      # La migration 20260904_deck_cards_deck_id réclame une connexion ayant les
      # droits sur user_deck_cards. Sur le poste de travail, cette table
      # appartient au rôle postgres et il faut un second compte ; ici, manamind
      # possède tout ce qu'il crée, les deux URL sont donc les mêmes.
      POSTGRES_URL: postgresql://${DB_USER:-manamind}:${DB_PASSWORD}@db:5432/${DB_NAME:-manamind}
      JWT_SECRET: ${JWT_SECRET}
      HTTPS_ENABLED: "true"
      DEBUG: "false"
      PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ton-domaine.com}
    volumes:
      # Fichiers déposés par les utilisateurs et recommandations produites :
      # ils doivent survivre à un redéploiement.
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      # Modèles de l'écran d'analyse. Ils sont dans .gitignore, donc absents du
      # dépôt et de l'image : c'est deploy/push_models.sh qui les dépose ici
      # depuis le poste de travail, et ce montage les expose au conteneur.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # Bind uniquement sur localhost — Caddy fait le frontal

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/log/caddy:/var/log/caddy
    restart: unless-stopped
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
