<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ManaMind — Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .hero-dash { min-height: 300px; }

  /* Les six chiffres tiennent sur une seule ligne : le bandeau occupe ici
     toute la largeur disponible et les écarts sont resserrés. */
  .hero-dash .hero__body { max-width: none; padding-right: var(--sp-6); }
  .hero-dash .hero__stats { gap: var(--sp-2) var(--sp-4); }

  /* Seuls les chiffres profitent de toute la largeur : un titre courant
     sur 1 400 px serait pénible à lire. */
  .hero-dash .hero__title,
  .hero-dash .hero__body > p { max-width: 820px; }

  /* Deux de ces chiffres mènent à la collection filtrée */
  a.hero__stat { transition: color var(--dur-fast) var(--ease); }
  a.hero__stat:hover b { color: var(--accent-bright); }
  a.hero__stat:hover .muted { color: var(--text-2); }

  /* Une carte qui dort mène au choix d'un commandant qui la jouerait */
  #dormantGrid .mtg-card { cursor: pointer; }
</style>
</head>
<body>

<div id="page">
  <section class="hero hero-dash" id="hero">
    <div class="hero__body">
      <div class="skeleton skeleton--text" style="width:180px;height:14px"></div>
      <div class="skeleton skeleton--text" style="width:420px;max-width:100%;height:38px;margin-top:12px"></div>
      <div class="skeleton skeleton--text" style="width:300px;height:16px;margin-top:14px"></div>
    </div>
  </section>

  <div id="alerts"></div>

  <section class="section" id="dormantSection" hidden>
    <div class="section-head">
      <div class="section-head__title">
        <h2 class="h2">Vos cartes dorment</h2>
        <span class="muted small" id="dormantCount"></span>
      </div>
      <a class="btn btn--sm" href="/collection?in_deck=no">Tout voir</a>
    </div>
    <p class="muted small" style="margin-top:-8px">
      Ces rares et mythiques vous appartiennent mais ne figurent dans aucun de vos decks.
    </p>
    <div class="card-grid" id="dormantGrid"></div>
  </section>

  <section class="section" id="recentSection" hidden>
    <div class="section-head">
      <div class="section-head__title">
        <h2 class="h2">Dernière carte ajoutée à ma collection</h2>
      </div>
      <a class="btn btn--sm" href="/collection?sort=recent">Voir la collection</a>
    </div>
    <div class="card-grid" id="recentGrid"></div>
  </section>
</div>

<script src="/static/js/mm.js"></script>
<script>
(async () => {
  // Les trois requetes de la page ne dependent pas les unes des autres, mais
  // s'enchainaient en cascade : MM.boot attend /auth/me, puis /api/dashboard,
  // puis /api/dashboard/highlights. On les lance ensemble et on n'attend plus
  // que la plus lente. Le resultat est enveloppe pour qu'un rejet arrivant
  // avant son await ne remonte pas en unhandledrejection.
  const dashboardReq = MM.api.get('/api/dashboard')
    .then((value) => ({ value }), (error) => ({ error }));
  const highlightsReq = MM.api.get('/api/dashboard/highlights?limit=8')
    .then((value) => ({ value }), (error) => ({ error }));

  const user = await MM.boot({ title: 'Accueil', nav: 'home' });
  if (!user) return;

  const dashboardRes = await dashboardReq;
  if (dashboardRes.error) {
    MM.el('#hero').innerHTML = `<div class="hero__body">
      <p class="muted">${MM.esc(dashboardRes.error.message)}</p></div>`;
    return;
  }
  const data = dashboardRes.value;

  const { stats, progress, freshness, profile } = data;
  const empty = stats.copies === 0;

  /* ── Hero ─────────────────────────────────────────────────────────────── */

  const featured = (stats.top_cards && stats.top_cards[0]) || null;
  const artId = (profile && profile.banner_scryfall_id)
    || (featured && featured.scryfall_id);
  const art = artId ? MM.scryfallArt(artId) : null;

  const greeting = user.display_name ? `Bonjour ${user.display_name}` : 'Bonjour';

  const heroStats = empty ? '' : `
    <div class="hero__stats">
      <span class="hero__stat"><b>${MM.fmt.int(stats.copies)}</b>
        <span class="muted small">exemplaires</span></span>
      <span class="hero__stat"><b>${MM.fmt.int(stats.distinct_cards)}</b>
        <span class="muted small">cartes différentes</span></span>
      <a class="hero__stat" href="/collection?in_deck=yes"
         ><b>${MM.fmt.int(Math.max(0, stats.lines - stats.dormant))}</b>
        <span class="muted small">utilisées</span></a>
      <a class="hero__stat" href="/collection?in_deck=no"
         ><b>${MM.fmt.int(stats.dormant)}</b>
        <span class="muted small">inutilisées</span></a>
      <span class="hero__stat"><b>${MM.fmt.eur(stats.value_eur, { compact: true })}</b>
        <span class="muted small">de valeur estimée</span></span>
      <span class="hero__stat"><b>${MM.fmt.int(stats.decks)}</b>
        <span class="muted small">decks</span></span>
    </div>`;

  MM.el('#hero').innerHTML = `
    ${art ? `<div class="hero__art" style="background-image:url('${MM.esc(art)}')"></div>` : ''}
    <div class="hero__body">
      <div class="hero__split">
      <div class="grow">
      <p class="eyebrow">${MM.esc(greeting)}</p>
      <h2 class="hero__title">${empty
        ? 'Votre collection vous attend'
        : 'Je vous aide au mieux à optimiser et à utiliser en jeu votre collection'}</h2>
      <p class="muted">${empty
        ? "Importez vos cartes une fois, et l'outil vous dira quels decks construire, "
          + 'quelles cartes dorment et lesquelles amélioreraient vos listes.'
        : `Dernière mise à jour ${MM.esc(MM.fmt.since(stats.last_update) || 'inconnue')}.`}</p>
      ${heroStats}
      </div>
      <div class="hero__actions">
        ${empty
          ? `<a class="btn btn--primary btn--lg" href="/collection/import">
               ${MM.icons.upload} Importer ma collection</a>
             <a class="btn btn--lg" href="/collection/ajout">Ajouter carte par carte</a>`
          : `<a class="btn btn--primary" href="/collection/ajout">
               ${MM.icons.plus} Ajouter des cartes à ma collection</a>
             <a class="btn" href="/collection/import">
               ${MM.icons.upload} Ajouter des decks</a>`}
      </div>
      </div>
    </div>
    ${featured && !profile.banner_scryfall_id && !empty
      ? `<span class="hero__credit">${MM.esc(featured.card_name)}</span>` : ''}`;

  /* ── Relances ─────────────────────────────────────────────────────────── */

  const alerts = [];

  if (!progress.complete) {
    alerts.push(`
      <div class="panel">
        <div class="panel__head">
          <div class="stack-2">
            <h3 class="h3">Terminez votre installation</h3>
            <p class="xs dim">${progress.done} étape${progress.done > 1 ? 's' : ''}
              sur ${progress.total}</p>
          </div>
          <div style="width:140px"><div class="progress">
            <div class="progress__bar" style="width:${progress.percent}%"></div>
          </div></div>
        </div>
        <div class="panel__body">
          <div class="steps">
            ${progress.steps.map((step) => `
              <a class="step ${step.done ? 'step--done' : ''}" href="${MM.esc(step.href)}">
                <span class="step__mark">${step.done ? MM.icons.check : ''}</span>
                <span class="step__text">
                  <span class="step__title">${MM.esc(step.label)}</span>
                  <span class="step__detail">${MM.esc(step.value || step.detail)}</span>
                </span>
                ${step.done ? '' : `<span class="btn btn--sm btn--outline">
                  ${MM.esc(step.cta)}</span>`}
              </a>`).join('')}
          </div>
        </div>
      </div>`);
  }

  if (!empty && freshness.stale) {
    alerts.push(`
      <div class="panel panel--accent">
        <div class="panel__body cluster">
          <span class="accent">${MM.icons.warning}</span>
          <div class="grow">
            <p class="strong">Votre collection n'a pas bougé depuis ${freshness.days} jours</p>
            <p class="small muted">Ajoutez vos dernières acquisitions pour que les
              recommandations restent justes.</p>
          </div>
          <div class="cluster-2">
            <a class="btn btn--primary btn--sm" href="/collection/ajout">Mettre à jour</a>
            <button class="btn btn--sm" id="markChecked">Elle est à jour</button>
          </div>
        </div>
      </div>`);
  }

  MM.el('#alerts').innerHTML = alerts.join('');

  const markButton = MM.el('#markChecked');
  if (markButton) {
    markButton.addEventListener('click', async () => {
      markButton.disabled = true;
      try {
        await MM.api.post('/api/profile/collection-checked');
        MM.toast.ok('Collection marquée à jour.');
        markButton.closest('.panel').remove();
      } catch (err) { MM.toast.error(err.message); markButton.disabled = false; }
    });
  }

  if (empty) return;

  /* ── Mises en avant ───────────────────────────────────────────────────── */

  try {
    const highlightsRes = await highlightsReq;
    if (highlightsRes.error) throw highlightsRes.error;
    const highlights = highlightsRes.value;

    if (highlights.dormant.length) {
      MM.el('#dormantSection').hidden = false;
      MM.el('#dormantCount').textContent =
        `${MM.fmt.int(stats.dormant)} au total`;
      MM.el('#dormantGrid').innerHTML =
        highlights.dormant.map((item) => MM.cardTile(item)).join('');

      // Cliquer une carte qui dort cherche un commandant capable de la jouer
      MM.el('#dormantGrid').addEventListener('click', (event) => {
        const card = event.target.closest('.mtg-card');
        if (!card || !card.dataset.name) return;
        location.href = '/cartes/commandant?card='
          + encodeURIComponent(card.dataset.name);
      });
      MM.els('#dormantGrid .mtg-card').forEach((card) => {
        card.title = `Trouver un commandant pour ${card.dataset.name}`;
      });
    }

    if (highlights.recent.length) {
      MM.el('#recentSection').hidden = false;
      MM.el('#recentGrid').innerHTML =
        highlights.recent.map((item) => MM.cardTile(item, { price: false })).join('');
    }
  } catch { /* les mises en avant sont secondaires */ }
})();
</script>
</body>
</html>
