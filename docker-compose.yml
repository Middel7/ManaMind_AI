# Environnement de DÉVELOPPEMENT. Le mot de passe et le secret JWT ci-dessous
# sont publics, ce fichier étant versionné dans un dépôt public.
#
# La production, c'est deploy/docker-compose.prod.yml, et elle se lance
# explicitement :
#   docker compose --project-directory /app -f deploy/docker-compose.prod.yml up -d
#
# Un « docker compose up » lancé sans -f depuis la racine prendrait CE
# fichier-ci : d'où les ports liés à 127.0.0.1 plus bas. La bévue reste
# possible, mais elle n'expose plus rien au réseau.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manamind
      POSTGRES_PASSWORD: manamind_dev
      POSTGRES_DB: manamind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Lié à la boucle locale : avec un mot de passe connu de tous, cette base
      # n'a rien à faire sur les autres interfaces, ni du poste ni du serveur.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manamind"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      # Même raison : DEBUG est à true et le secret JWT est public. Exposée au
      # réseau, cette application laisserait forger n'importe quel jeton.
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://manamind:manamind_dev@db:5432/manamind
      JWT_SECRET: dev-secret-change-in-prod
      DEBUG: "true"
      HTTPS_ENABLED: "false"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
