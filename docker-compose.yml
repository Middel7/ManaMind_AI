services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manamind
      POSTGRES_PASSWORD: manamind_dev
      POSTGRES_DB: manamind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manamind"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://manamind:manamind_dev@db:5432/manamind
      JWT_SECRET: dev-secret-change-in-prod
      DEBUG: "true"
      HTTPS_ENABLED: "false"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
