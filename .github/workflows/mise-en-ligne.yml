# Mise en ligne automatique apres un merge dans main.
#
# Le serveur ne se met pas a jour tout seul : jusqu'ici, chaque livraison
# demandait une session SSH, un git pull, un docker build et un redemarrage.
# Ce workflow fait les trois, et ne les fait QUE si les tests passent.
#
# Ce qui s'execute sur le serveur est volontairement identique, ligne pour
# ligne, a ce que decrit deploy/README-HETZNER.md : une procedure ecrite a deux
# endroits finit par diverger, et c'est le README qui fait foi.
#
# Trois secrets, deposes dans le depot :
#   DEPLOY_SSH_KEY      cle privee dediee, sans phrase de passe
#   DEPLOY_HOST         adresse du VPS
#   DEPLOY_KNOWN_HOSTS  empreinte du serveur, pour ne pas accepter n'importe qui
#
# La cle publique correspondante vit dans /root/.ssh/authorized_keys du VPS,
# commentee « github-actions-manamind ». La revoquer n'affecte aucun autre acces.

name: Mise en ligne

on:
  push:
    branches: [main]
  # Permet de rejouer une mise en ligne depuis l'onglet Actions, sans avoir a
  # produire un commit vide.
  workflow_dispatch:

# Deux livraisons rapprochees ne doivent pas reconstruire l'image en meme temps
# sur la meme machine. `cancel-in-progress: false` : on attend la fin de la
# precedente plutot que de l'interrompre au milieu d'un docker build.
concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dependances
        # Les memes groupes que l'image de production, plus les outils de test.
        # Le groupe « ml » est volontairement absent : son numba epingle ne se
        # resout pas en Python 3.12, et rien dans les tests ne l'utilise.
        run: uv sync --frozen --no-default-groups --group analyze --group dev

      - name: Lancer les tests
        # L'interpreteur du venv directement, et non « uv run » : celui-ci
        # resynchronise l'environnement complet et bute sur le meme numba.
        run: .venv/bin/python -m pytest -q

  mise-en-ligne:
    name: Mise en ligne
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Preparer l'acces SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # L'empreinte vient d'un secret, pas d'un ssh-keyscan fait a la
          # volee : scanner au moment de la connexion revient a faire confiance
          # a qui repond, ce qui vide la verification de son sens.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Tirer le code, reconstruire, redemarrer
        run: |
          ssh -o BatchMode=yes root@${{ secrets.DEPLOY_HOST }} bash -s <<'DISTANT'
          set -euo pipefail
          cd /app
          git fetch --prune
          git checkout main
          git pull --ff-only
          docker build -t manamind:latest .
          docker compose --project-directory /app \
            -f deploy/docker-compose.prod.yml up -d --no-deps app
          DISTANT

      - name: Verifier que le serveur repond
        # Sans cette etape, une mise en ligne qui laisse le conteneur en boucle
        # de redemarrage s'afficherait en vert. C'est arrive : une migration
        # refusee empechait le demarrage, et seule une visite du site l'a montre.
        run: |
          ssh -o BatchMode=yes root@${{ secrets.DEPLOY_HOST }} bash -s <<'DISTANT'
          set -euo pipefail
          for essai in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                   http://127.0.0.1:8080/health || true)
            if [ "$code" = "200" ]; then
              echo "Le serveur repond (essai $essai)."
              exit 0
            fi
            sleep 4
          done
          echo "Le serveur n'a pas repondu en deux minutes. Journal :" >&2
          docker compose --project-directory /app \
            -f deploy/docker-compose.prod.yml logs --tail 40 app >&2
          exit 1
          DISTANT
